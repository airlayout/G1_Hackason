# Button_Press / エレベーターの立つ位置まで寄る設定（2026-11-10 から）。
# 人がリモコンで柱の手前（約 0.6〜1.5 m）に置き、そこから頭カメラだけで寄る。座標は pelvis 基準 [m]（x 前方、y 左、z 上）。

# ---- 柱の面を深度で求める（common/column_face.py。ボタンが画像の上に外れる遠さで使う） ----
face:
  # 深度を何画素おきに使うか（640×480 で 4 なら 160×120 点）
  step_px: 4
  # 深度を使う範囲 [m]（カメラからの奥行き）
  min_depth_m: 0.25
  max_depth_m: 2.5
  ransac_iterations: 200
  seed: 0
  floor:
    # 床とみなす平面の、真上からの傾きの上限 [deg]（首の向きのずれもここに入る。11/3 は URDF から 3〜6°）
    max_tilt_deg: 20
    # 床とみなす高さ（pelvis 座標の z）。立っていれば約 −0.73
    z_range_m: [-1.0, -0.45]
    threshold_m: 0.015
    min_points: 150
    # 床から首の向きを直すのに要る、床の点の広がり [前後, 左右] [m]。狭い床（画像の下の細い帯）では法線が数度ずれるので、
    # 足りなければ床からは直さず、前のフレームの直し方を使う
    min_extent_m: [0.20, 0.40]
    # 床で首の向きを直す（false なら床は探すだけ）。直す量の上限を超えたら、首がずれているとみなして止める（直すときだけ）。
    # 2026-11-14 に false にした: 11/13 の実機の収録で、直すと柱の面までの距離が「ボタンから求めた距離」（URDF 47.6° のまま
    # 計算し、それで押して点灯した）より 3〜7 cm 近く出て、ばらつきも ±2〜3 cm（柱の前は床が細い帯で、直す量が 3〜10° 揺れる。
    # 約 90 cm でも 4 cm 違う）。直さなければ 0.5〜0.8 cm で合い、ばらつき ±0.2 cm。寄る流れは遠くは柱の面・近くはボタンに
    # 切り替えるので、両方を同じ向き（URDF）で計算する。首が大きくずれたとき（10° 超）は auto_press の事前確認が止める。
    # 床から測る首の向き（約 51°）とボタンが合う向き（47.6°）の約 3.4° の差の正体は、メジャーと比べて確かめる（ToDo_20261114）
    correct_pitch: false
    max_correction_deg: 15
  wall:
    # 立った面とみなす、法線の水平からの傾きの上限 [deg]（首のずれを直す前は max_correction_deg だけ緩くして探す）
    vertical_tol_deg: 10
    # 面の向き（正対からの角度）の上限 [deg]。これより斜めの面（横の壁など）は使わない
    max_yaw_deg: 45
    threshold_m: 0.015
    # 向きと奥行きの段: 立った面の点を向きごとに投影した奥行きのヒストグラムの区画の幅（これが最も鋭くなる向きを探す）
    layer_bin_m: 0.005
    # 段（柱・壁・扉）に乗った点を選ぶ幅: 距離 × refine_per_m を [下限, 上限] に収める（1 m で 8 mm）。
    # 壁から 1 cm しか出ていない柱を、壁と分けるため。実機の深度の雑音（1 m で数 mm）より狭くしない
    refine_per_m: 0.008
    refine_threshold_m: [0.006, 0.015]
    # 床から何 m より上の点を使うか（床と面の境目・幅木を除く）
    min_above_floor_m: 0.05
    min_points: 150
    # 前方の通り道の左右の幅の半分 [m]。この中に min_corridor_points 点以上かかる面だけを候補にする
    corridor_half_m: 0.30
    min_corridor_points: 50
    # 探す立った面の数（柱・扉・後ろの壁）
    max_planes: 4
  edges:
    # 面に沿って点を並べる区画の幅と、つながっているとみなす空きの区画の数
    bin_m: 0.02
    gap_bins: 1
    # 端の点がこの画素数より画像の左右の縁に近ければ、画像で切れているとみなす（端は分からない）
    border_px: 8
  tracking:
    # 直近 window 枚のうち、中央値から ±max_spread/2・±max_yaw_spread/2 以内に frames 枚以上あれば、その中央値（外れ値に強い）。
    # 柱が壁から少ししか出ていない（評価環境は 1 cm）と、雑音で手前の段が柱と壁で入れ替わって距離が 1 cm 飛ぶ。寄るのには 2 cm で足りる
    frames: 3
    window: 5
    max_spread_m: 0.02
    max_yaw_spread_deg: 2.0
    # 柱の端のばらつきの上限 [m]。中央値から ±この半分に、半分より多いフレームがそろわなければ、その端は分からないとする
    # （11/14: ホワイトボードの光沢で、1 回の観測の中で左端が +1・+7・+35・+57・+63 cm とばらつき、誤った端で逆へ動いた）
    max_edge_spread_m: 0.06

# ---- 1 回分だけ歩く（common/loco.py。純正の歩行コントローラの LocoClient.SetVelocity） ----
# ⚠️ 値の多くは仮。出どころは Navigation 班の実機の記録（Navigation/nav2_stable/Planning.md の U-07・U-12、2026-09-09。
# 前に 1 秒だけ送った結果）。横・回る・短い時間（1 秒未満）は誰も測っていない。実機日（E）に測って直す。
loco:
  # 最初に送る前に、FSM がこの中かを確かめる（null なら確かめない）。501 = 腰 3 自由度の Regular（立ち上げ後の値、HANDOFF の 3）
  allowed_fsm_ids: [501]
  # SetVelocity の duration の上限 [s]。このプロセスが落ちても、この時間で G1 が自分で止まる
  max_duration_s: 1.0
  # 送ってよい速さの範囲（絶対値）。下限より遅いと歩き出さない・向きが定まらない（vx 0.1 は動かず、0.2 は向きが +98.6° ずれた）
  min_speed: {vx: 0.25, vy: 0.25, wz: 0.25}
  max_speed: {vx: 0.35, vy: 0.30, wz: 0.50}
  # 1 回で動ける最小の量（rate × min_duration_s）のこの割合より小さいずれは、直さない
  min_fraction: 0.5
  axes:
    # speed: 送る速さ、rate: 1 秒あたりに実際に動いた量（歩き終わりの分を含む。m/s か rad/s）、時間の範囲 [s]
    # 前: vx 0.3 を 1 秒で Δx +0.228〜+0.231 m（3 回）。向きは −18〜−20° ずれた。11/14（頭カメラ）: 0.5 秒で +8.8・+9.0 cm、
    # 1 秒で +22.8 cm（向きのずれ −0.1°）→ loco_fit の当てはめ 0.21
    forward: {speed: 0.30, rate: 0.21, min_duration_s: 0.5, max_duration_s: 1.0}
    # 後ろ: 頭のセンサの後ろ上が死角なので、既定では使わない（近すぎたら人がリモコンで下げる）
    backward: {enabled: false, speed: 0.30, rate: 0.20, min_duration_s: 0.5, max_duration_s: 1.0}
    # 横・回る: 11/14 に実機で測った（頭カメラ。DAILY_LOG_20261114_laptop の「歩く 1 回分」）。寄る流れは頭カメラで測り直すので、頭カメラの値を使う
    # 横: 0.5 秒では歩き出さない（左 −0.8 cm）→ 1.0 秒だけ。右へ大きく動く偏りがある（左 10.4・10.6 cm、右 24.8・21.9 cm。
    # メジャーでも左 約 15 cm・右 約 20 cm で右が大きい）
    left: {speed: 0.30, rate: 0.105, min_duration_s: 1.0, max_duration_s: 1.0}
    right: {speed: 0.30, rate: 0.23, min_duration_s: 1.0, max_duration_s: 1.0}
    # 回る: 左 1 秒 +10.8°・0.5 秒 +4.9°、右 1 秒 −11.6°（右の 0.5 秒は試していない。左と同じとみる）
    turn_left: {speed: 0.30, rate: 0.19, min_duration_s: 0.5, max_duration_s: 1.0}
    turn_right: {speed: 0.30, rate: 0.19, min_duration_s: 0.5, max_duration_s: 1.0}
  # 止まったかの判定: 脚 12 関節の角速度がこの値以下で hold_s 続いたら止まった。指令の時間のあと timeout_s 待っても
  # 止まらなければ StopMove を送って中止する（歩き終わりは約 1.9 秒、完全に止まるまで 3.4 秒。U-07）
  still:
    max_leg_dq_rad_s: 0.1
    hold_s: 0.5
    # これより短く跳ねた値は動いたとみなさない [s]（11/14: 止まって立っていても 0.3〜0.5 秒おきに 1 回、0.2〜0.3 rad/s が跳ね、
    # 寄る流れが timeout_s に届いて中止した。lowstate を見る間隔 poll_s 0.05 秒で、1〜2 回続けて超えた分までを無視する）
    spike_s: 0.1
    # 跳ねとみなす値の上限 [rad/s]。これより大きければ短くても動いたとみなす（11/14 の跳ねは 0.2〜0.46。歩いている間は 1〜5）
    spike_max_dq_rad_s: 0.5
    timeout_s: 6.0
    poll_s: 0.05
    max_state_age_s: 0.2
  # 寄る 1 回の中での上限（寄る流れが間違って回り続けても止まる）
  limits:
    max_pulses: 15
    max_forward_total_m: 1.5
    # 横へ動いた見込みの合計（左右で打ち消す）の上限 [m]。頭カメラは前の下しか見ず、横の物は見えない（11/14、横のハーネスの台にぶつかった）。
    # とりあえず緩め（ユーザー）
    max_side_total_m: 0.5

# ---- 寄る流れ（common/approach.py。観測 → 1 回動く → 止まる → 観測） ----
approach:
  # 計画を試す腕（順に。最初に計画が立った腕で押す）。左腕も試すなら [right, left]
  arms: [right]
  # 前後の目安 [m]。null なら elevator.yaml の press.stand（押す組ごと）の target_dist_m、それも無ければ min〜max の中点
  target_dist_m: null
  # これより近いと中止する（壁にぶつかる。後ろへは動かないので、人がリモコンで下げる）
  min_safe_dist_m: 0.27
  # 面しか見えないうちは、ここまでしか前へ進まない [m]（▲▼ が見え始める距離。頭カメラ 53° で車いす用は約 46〜49 cm から見える）。
  # ▲▼ が見えてから左右を直す余地を残す
  face_stop_dist_m: 0.50
  # 面しか見えないうちに柱の端で横を直すとき、前の観測から端がこれより大きく飛べば別の段（柱と壁など）の端とみなして使わない [m]
  # （1 回分の前進で横にずれうる最大: 0.23 m × 1.3 × sin30° ≈ 0.15 m）
  max_edge_shift_m: 0.15
  # 端の飛びは、端ごとに最後に使えた値と比べる（その後に送った横の 1 回分の見込みは差し引く。common/approach.py の EdgeCheck）。
  # 左右の端が両方見えたら、その幅を最初に両方見えた幅と比べ、これより違えば両方使わない [m]（11/14: 幅 95 cm の板で、誤った左端との幅が 34 cm）
  edge_width_tol_m: 0.10
  # 柱の端で横を直すのは、端のずれがこれより大きいときだけ [m]（side_tol_m より大きくする。乱しありでは柱と壁の段の入れ替わりで
  # 端が ±7 cm 揺れ、4 cm のままでは左右に行ったり来たりして回数の上限で止まった）
  edge_tol_m: 0.08
  # 前進は、勧める範囲の近い側からこれだけ手前で止める [m]
  forward_margin_m: 0.03
  # 1 回分の安全の見積もり: 多めに動く割合と、進む向きのずれの最大 [deg]（純正の歩行は前へ −18〜−20° ずれた。U-12）。
  # 横に動くと、動いた量 × sin(この角度) だけ前にも出るとみなす。この最悪でも min_safe_dist_m より近づく 1 回分は送らない
  step_uncertainty: 0.3
  max_heading_error_deg: 30
  # 向きがこれより大きくずれていれば、まず回る [deg]
  yaw_tol_deg: 6
  # ▲▼ が見えて計画が立たないとき、左右の目安（press.stand.center_side_m）からこれより離れていれば横へ動く [m]
  side_tol_m: 0.04
  # 観測の回数の上限（動く回数の上限は loco.limits）
  max_steps: 12
  # ▲▼ が組にならなくても、1 個だけ見えたボタンの左右を手がかりにする条件: 柱の面からの奥行きのずれの上限 [m]（5 cm だと、
  # 5 cm 奥の扉の上の物まで拾い、逆に動いてボタンが画像から外れた）と、
  # 同じ左右（elevator.yaml の column_tolerance_m 以内）に見えたフレームの数の下限（1 回の観測の中で）
  single_depth_tol_m: 0.03
  single_min_frames: 2
  # 1 回の観測で読むフレームの上限と、動いたあとに読み飛ばすフレームの数
  max_frames: 15
  skip_frames_after_move: 2
