# Button_Press / エレベーターの立つ位置まで寄る設定（2026-11-10 から）。
# 人がリモコンで柱の手前（約 0.6〜1.5 m）に置き、そこから頭カメラだけで寄る。座標は pelvis 基準 [m]（x 前方、y 左、z 上）。

# ---- 柱の面を深度で求める（common/column_face.py。ボタンが画像の上に外れる遠さで使う） ----
face:
  # 深度を何画素おきに使うか（640×480 で 4 なら 160×120 点）
  step_px: 4
  # 深度を使う範囲 [m]（カメラからの奥行き）
  min_depth_m: 0.25
  max_depth_m: 2.5
  ransac_iterations: 200
  seed: 0
  floor:
    # 床とみなす平面の、真上からの傾きの上限 [deg]（首の向きのずれもここに入る。11/3 は URDF から 3〜6°）
    max_tilt_deg: 20
    # 床とみなす高さ（pelvis 座標の z）。立っていれば約 −0.73
    z_range_m: [-1.0, -0.45]
    threshold_m: 0.015
    min_points: 150
    # 床で首の向きを直す（false なら床は探すだけ）。直す量の上限を超えたら、首がずれているとみなして止める
    correct_pitch: true
    max_correction_deg: 15
  wall:
    # 立った面とみなす、法線の水平からの傾きの上限 [deg]
    vertical_tol_deg: 10
    # 面の向き（正対からの角度）の上限 [deg]。これより斜めの面（横の壁など）は使わない
    max_yaw_deg: 45
    threshold_m: 0.015
    # 床から何 m より上の点を使うか（床と面の境目・幅木を除く）
    min_above_floor_m: 0.05
    min_points: 150
    # 前方の通り道の左右の幅の半分 [m]。この中に min_corridor_points 点以上かかる面だけを候補にする
    corridor_half_m: 0.30
    min_corridor_points: 50
    # 探す立った面の数（柱・扉・後ろの壁）
    max_planes: 4
  edges:
    # 面に沿って点を並べる区画の幅と、つながっているとみなす空きの区画の数
    bin_m: 0.02
    gap_bins: 1
    # 端の点がこの画素数より画像の左右の縁に近ければ、画像で切れているとみなす（端は分からない）
    border_px: 8
  tracking:
    # 新しいフレームで続けて測る数と、そのばらつきの上限
    frames: 3
    max_spread_m: 0.01
    max_yaw_spread_deg: 1.5

# ---- 1 回分だけ歩く（common/loco.py。純正の歩行コントローラの LocoClient.SetVelocity） ----
# ⚠️ 値の多くは仮。出どころは Navigation 班の実機の記録（Navigation/nav2_stable/Planning.md の U-07・U-12、2026-09-09。
# 前に 1 秒だけ送った結果）。横・回る・短い時間（1 秒未満）は誰も測っていない。実機日（E）に測って直す。
loco:
  # 最初に送る前に、FSM がこの中かを確かめる（null なら確かめない）。501 = 腰 3 自由度の Regular（立ち上げ後の値、HANDOFF の 3）
  allowed_fsm_ids: [501]
  # SetVelocity の duration の上限 [s]。このプロセスが落ちても、この時間で G1 が自分で止まる
  max_duration_s: 1.0
  # 送ってよい速さの範囲（絶対値）。下限より遅いと歩き出さない・向きが定まらない（vx 0.1 は動かず、0.2 は向きが +98.6° ずれた）
  min_speed: {vx: 0.25, vy: 0.25, wz: 0.25}
  max_speed: {vx: 0.35, vy: 0.30, wz: 0.50}
  # 1 回で動ける最小の量（rate × min_duration_s）のこの割合より小さいずれは、直さない
  min_fraction: 0.5
  axes:
    # speed: 送る速さ、rate: 1 秒あたりに実際に動いた量（歩き終わりの分を含む。m/s か rad/s）、時間の範囲 [s]
    # 前: vx 0.3 を 1 秒で Δx +0.228〜+0.231 m（3 回）。向きは −18〜−20° ずれた
    forward: {speed: 0.30, rate: 0.23, min_duration_s: 0.5, max_duration_s: 1.0}
    # 後ろ: 頭のセンサの後ろ上が死角なので、既定では使わない（近すぎたら人がリモコンで下げる）
    backward: {enabled: false, speed: 0.30, rate: 0.20, min_duration_s: 0.5, max_duration_s: 1.0}
    # 横・回る: 測っていない（仮の値）
    left: {speed: 0.30, rate: 0.20, min_duration_s: 0.5, max_duration_s: 1.0}
    right: {speed: 0.30, rate: 0.20, min_duration_s: 0.5, max_duration_s: 1.0}
    turn_left: {speed: 0.30, rate: 0.25, min_duration_s: 0.5, max_duration_s: 1.0}
    turn_right: {speed: 0.30, rate: 0.25, min_duration_s: 0.5, max_duration_s: 1.0}
  # 止まったかの判定: 脚 12 関節の角速度がこの値以下で hold_s 続いたら止まった。指令の時間のあと timeout_s 待っても
  # 止まらなければ StopMove を送って中止する（歩き終わりは約 1.9 秒、完全に止まるまで 3.4 秒。U-07）
  still:
    max_leg_dq_rad_s: 0.1
    hold_s: 0.5
    timeout_s: 6.0
    poll_s: 0.05
    max_state_age_s: 0.2
  # 寄る 1 回の中での上限（寄る流れが間違って回り続けても止まる）
  limits:
    max_pulses: 15
    max_forward_total_m: 1.5
