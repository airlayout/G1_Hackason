# Button_Press / 全体をつなぐスクリプト（タスク6）の設定。当日はコードを編集せず、ここだけを変える。

# 動かす腕（configs/arm.yaml の arm より優先）
arm: right

target:
  # 対象の位置の与え方:
  #   depth  : 頭カメラの検出と深度から求める（configs/localize.yaml。較正値 calibration.offset_pelvis_m を必ず足す）
  #   manual : 下の manual の値を使う（深度が使えないとき）
  source: depth

  depth:
    # この枚数のフレームで位置を求め、中央値を使う
    frames: 5
    # 位置が求まったフレームがこれより少なければ中止
    min_valid_frames: 3
    # フレームごとの位置のばらつき（各軸の最大 − 最小）がこれを超えたら中止 [m]
    max_spread_m: 0.02
    # 指先（FK）を画像に投影して、対象の枠の中に入っていたら「手が対象を隠している」とする
    #   warn: 警告だけ出して続ける | abort: 中止する
    hand_in_view: warn
    # 測った面の点から、押す点をずらす量 [m]（pelvis 座標。x 前、y 左、z 上）。測った点のままなら 0
    offset_m: [0.0, 0.0, 0.0]

  manual:
    # どちらか一方を書く（両方あれば point_pelvis_m を使う）:
    # 1. pelvis 座標の点 [m]（対象の表面の、押す点）
    point_pelvis_m: null
    # 2. 教えた姿勢（configs/taught_poses.yaml）の中指の先の位置から、定規で測ったずれ offset_m [m] の点。
    #    例: ボトルの表面に中指の先を触れさせた姿勢を reference として記録しておき、ずれは 0 にする。
    #    ボトルを動かしたら、動かした量（pelvis 座標の向き。x 前、y 左、z 上）を offset_m に書く
    taught_pose: null
    offset_m: [0.0, 0.0, 0.0]

# 勧める立つ位置（ボトル）。外なら、どちらへ何 cm 動けばよいかを出す（計画できなければ中止の理由に添え、計画できれば
# 注意だけ出して続ける。範囲の外でも押せることはあるので、これだけでは止めない）。
# target は押す点（ボトルの手前の面）の pelvis の x、side は押す腕の側へのずれ（右腕なら −y。左腕は左右を反転）、
# table_edge は障害物のうち名前に table を含む箱の手前の縁の x。
# 2026-10-15、MuJoCo（机の高さ 0.69・0.74・0.79 m、縁からボトルの面まで 3・6・12 cm、押す点まで 26〜48 cm、
# 右に 15・20・25 cm の 621 通り）で、押し込みを止める処理（press.yaml の contact_stop）を入れたあと:
# - 机の縁が近いと、経由の姿勢へ手を上げる途中で手首が縁に当たる（計画で断る）。縁までの最小は机 0.69 m で 25 cm、
#   0.74 m で 27 cm、0.79 m で 29 cm
# - 押す点が遠いと腕が届かない。最大は机 0.69 m で 38〜41 cm、0.74 m で 43〜45 cm、0.79 m で 43〜45 cm
# - 押す点が体の正面寄り（右に 5 cm 以内）だと、右肩が胴体に当たって計画できない
# （上は 2026-10-31 まで既定だった経由の姿勢での値。その範囲は configs/reach_legacy.yaml に残した）
# 2026-10-31 から、経由の姿勢と指の向きを広げた設定（下の via_pose・finger_tilts_deg）にした。左右と机の縁の範囲は、それを
# MuJoCo（sim/reach_verify.py、ボトル・机あり、物理あり、2026-10-29）で押せた範囲: 机の縁 20〜40 cm、ボトルは右 25 cm〜体の正面
# （右 0 cm）。左 5 cm は失敗した。計画だけの地図（sim/reach_map.py）では縁 18 cm・左 5 cm まで通る。押す点までの範囲（腕の届く距離）は前と同じ
stand:
  target_min_m: 0.30
  target_max_m: 0.40
  side_min_m: 0.0
  side_max_m: 0.25
  table_edge_min_m: 0.20

push:
  # 押す方向: forward（pelvis の前方 [1, 0, 0]）| [x, y, z]（pelvis 座標のベクトル）
  direction: forward

# 経由する姿勢: 開始 → 経由 → 手前の姿勢 の順に動き、戻るときも経由する。次のどれか:
#   null: 直接
#   zero: 腕のゼロ姿勢（肘を約 90° 曲げて手を胸の前に出した姿勢）
#   教えた姿勢の名前（configs/taught_poses.yaml。実機日に、机の縁より手前で手を上げた姿勢を記録してもよい）
#   [7 つの角度 deg]: 右腕の shoulder_pitch, shoulder_roll, shoulder_yaw, elbow, wrist_roll, wrist_pitch, wrist_yaw
#                     （左腕は左右を反転して使う）
# 両腕を下ろした姿勢から関節空間でまっすぐ動くと、手が机の縁の下をくぐって机に当たる（MuJoCo で確認。
# ゼロ姿勢を経由しても当たった）。既定は、肩を後ろへ引き、肘を曲げて手を体の近くで持ち上げる姿勢
# （机の縁より手前で手を上げてから、机の上へ出る）。机は configs/press.yaml の obstacles か
# configs/obstacles.yaml（teach.py --obstacle）に書くと、当たる経路は計画の段階で拒否される。
# 肩ピッチ 17.2° では、両腕を下ろした姿勢から上げる途中で手が机の 4〜8 mm まで近づき（MuJoCo の机）、
# 開始姿勢が少しずれると余裕 1 cm を割った。28.6° なら 180 mm 以上離れる（2026-09-29 のリハーサルで確認）
# 【2026-10-31 から既定】[68.3, -11.1, -40.9, -43.9, 0.0, -4.1, 0.0]（前の configs/reach_wide.yaml）: 計画だけの探索（sim/via_refine.py、
# 2026-10-29）で、ボトルを押せる範囲が 2.7 倍（1,456 通り中 249 → 684。机の縁が 32 cm 以上 → 18 cm 以上）。開始の腕を ±4° ずらしても、
# 余裕を変えても同じ傾向。肩を前へ大きく上げる（経由の姿勢へ最大 約 113°、約 12 秒）。
# 確かめたこと: MuJoCo で 13 配置中 12 配置で押せた（sim/reach_verify.py）。実機（2026-10-31）: dry-run で、体の正面のボトル・机の縁 22 cm
# でも計画が通った（指 左 30°）。確認モードで 1 回押した（ボトル固定、右 15 cm）: 接触で止まった（17.6 mm）が、**体が前へ最大 84 mm・7.5° 傾き**、
# 経由の姿勢の追従誤差が 3.06°・3.78°（許容 2.9°）だった（docs/reports/REPORT_20261031.md）。押す間の体の傾き（body_motion.csv）を見ながら使う。
# 前の既定 [28.6, -11.5, 0.0, -34.4, 0.0, 0.0, 0.0]（10/21〜22 に実機で押した）は configs/reach_legacy.yaml（--overlay reach_legacy.yaml で戻せる）
via_pose: [68.3, -11.1, -40.9, -43.9, 0.0, -4.1, 0.0]

# 指の向きの候補 [左 deg, 上 deg]（小さい順に試し、先に通ったものを使う）。[0, 0] は押す向きに合わせる。ボトルが体の正面寄り
# （右 10 cm より内側）だと、前方に合わせた指では手前の姿勢で手首が胴体に近づきすぎて断られる。指を左へ傾けると通る
# （sim/approach_search.py、2026-10-29: 右 10 cm〜左 5 cm の配置で 0 → 9〜11 / 12）。下向き（上 −15°）を足すと通る数は増えるが、
# MuJoCo ではハンドの側面が先にボトルに触れ、指先が面の手前 12〜35 mm で止まるので入れない。【2026-10-31 から既定】前は [[0, 0]]
finger_tilts_deg: [[0, 0], [15, 0], [30, 0], [45, 0]]

# IK の初期値に使う、教えた姿勢の名前（configs/taught_poses.yaml）。無ければ今の姿勢から解く（警告を出す）
seed_pose: press_bottle

# 記録の保存先（リポジトリ直下からの相対パス）
log_dir: _local/button_press/runs
