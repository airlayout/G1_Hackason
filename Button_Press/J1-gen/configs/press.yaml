# Button_Press / IK と押し込みの軌道の設定（タスク2）
# 座標はすべて pelvis 基準 [m]（x 前方、y 左、z 上）。

ik:
  # 収束の判定: 手先の位置の誤差 [m] と、指の向きの誤差 [deg]。
  # 押し込みの直線では 1 周期に約 0.6 mm しか進まないので、ここが粗いと点ごとの解が飛び飛びになる
  tol_pos_m: 0.0005
  tol_axis_deg: 1.0
  # 指の向きを合わせる強さ（位置に対する重み。大きいほど向きを優先）
  axis_weight: 0.3
  # 減衰付き擬似逆行列の λ
  damping: 0.05
  # 1 回の反復で動かす関節角の上限 [rad]
  max_step_rad: 0.1
  # 余った自由度で初期値（記録した姿勢）に近づける強さ
  null_gain: 0.1
  max_iter: 300
  # 関節リミットからこれより内側でなければ「リミットに当たる」として拒否する [rad]
  # （configs/arm.yaml の safety.limit_margin_rad と同じ値にする）
  limit_margin_rad: 0.05

collision:
  # 肘から先とハンドが、体（胴体・脚・反対の腕）にこれより近づく姿勢は拒否する [m]
  clearance_m: 0.01
  # 関節空間で補間して移動する区間は、この数の点で調べる
  joint_path_samples: 30

press:
  # 押す方向に沿って、対象の手前この距離の姿勢（手前の姿勢）までは関節空間で移動する [m]
  approach_distance_m: 0.05
  # 対象の表面からさらに押し込む深さ [m]。ボトルは柔らかいので浅め（HANDOFF: 1〜2cm）
  press_depth_m: 0.015
  # 押し込みの深さの上限 [m]。空振りしたときに腕が勢いよく伸びないように
  max_press_depth_m: 0.03
  # 直線で押し込む速さ [m/s]
  press_speed_m_s: 0.03
  # 押し込んだ位置で止まる時間 [秒]
  hold_s: 0.5
  # 指の向きを押す方向にそろえるか（false なら位置だけを合わせる）
  align_finger: true

# 手先が入ってよい箱（pelvis 座標）。外に出る目標は拒否する。
# ⚠️ 仮の値。実機日に、ティーチングで記録した押し込み姿勢の手先位置を見て調整する
workspace:
  right:
    min: [0.10, -0.55, -0.35]
    max: [0.65, 0.15, 0.45]
  left:
    min: [0.10, -0.15, -0.35]
    max: [0.65, 0.55, 0.45]
