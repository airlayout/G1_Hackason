# Button_Press / エレベーターの呼びボタン（一般用の ▲▼）を見つける設定（common/elevator_buttons.py）
# 座標は pelvis 基準 [m]（x 前方、y 左、z 上）。

# 候補を画像で探す方法: classic（明るい灰色の丸。MuJoCo の評価環境向け）/ yolo（自分で学習した重み）
detector: classic

classic:
  # まわりの明るさを見る範囲 [px]（局所の平均）。柱は照明で上ほど明るく写るため、画像全体では見ない
  background_px: 121
  # まわりより明るい量（0〜255）と、色の強さ（最大 − 最小）の上限（青い車いすの印などを除く）
  min_contrast: 18
  max_chroma: 40
  min_area_px: 40
  max_area_px: 20000
  # 枠に対して面が占める割合の下限（細長い線や縁を除く）と、縦横比の上限
  min_fill: 0.5
  max_aspect: 2.5

yolo:
  # 学習した重み。クラスは up / down。2026-11-01 から、8 本の動画で学習した最終版（リポジトリの weights/。README.md）。
  # 前の既定は _local/button_press/button_yolo/weights/best.pt（sim/train_button_yolo.py、git の対象外）。
  # .onnx を書くと onnxruntime で動かす（torch・ultralytics なし。G1 の PC2 向け）: Button_Press/J1-gen/weights/button_final8.onnx
  weights: Button_Press/J1-gen/weights/button_final8.pt
  confidence: 0.4
  # .pt のときだけ使う（auto / cpu / 0 など）
  device: auto
  # .onnx のときだけ使う。onnxruntime のスレッド数（null = 全コア。PC2 では 4 がよい: Perception/docs/report/2026-10-31_g1_webcam_yolo.md）
  threads: null

# 頭カメラの位置の補正（pelvis 座標で足す [m]）。null なら configs/localize.yaml の calibration.offset_pelvis_m
# （実機日の段階4の較正の結果。ボトルと同じ頭カメラなので同じ値を使う）。ボタンだけ別の値にするときは [x, y, z] を書く
# 2026-11-01 のラボのエレベーター（柱まで約 32 cm、車いす用 ▼）: 指先が狙いより約 2.7 cm 手前の壁、ボタンの約 2 cm 右に当たった
# （上下は合っていた）→ x −2.0 cm、y +2.0 cm で左右・上下は合った。x はまだ約 1.1 cm 奥だったので −3.0 cm にした。
# 2026-11-03: このずれは、狙った中指の先ではなく小指の先（中指から前 22 mm・右 22 mm）が当たっていたためと分かった。
# 中指でまっすぐ押す（press.by_button_set.wheelchair）ので、補正なし（localize.yaml の値）に戻す
calibration:
  offset_pelvis_m: null

geometry:
  # 深度を使う範囲 [m]
  min_depth_m: 0.15
  max_depth_m: 2.0
  # 1 つのボタンに要る深度の点の数
  min_points: 20
  # ボタンの直径（評価環境は 3〜4.5 cm。車いす用はそれより小さい）
  min_diameter_m: 0.015
  max_diameter_m: 0.07
  # 同じ柱とみなす左右のずれ
  column_tolerance_m: 0.04
  # 押す組: general（柱でいちばん上の 2 つ。評価環境）/ wheelchair（いちばん下の 2 つ。ラボのエレベーターは車いす用の下の
  # ボタンを押す）。環境変数 J1GEN_BUTTON_SET で上書きできる。
  # wheelchair は、いちばん下の 2 つが pelvis から wheelchair_max_z_m 以下のときだけ（一般用の組を取り違えない）。
  # ラボ（2026-10-22 にメジャーで測定。床から）: 一般用 ▲ 約 124 cm・▼ 約 117 cm、車いすの印 約 103 cm、車いす用 ▲ 約 93.5 cm・
  # ▼ 約 87 cm（間隔 約 7 cm、直径 約 3.5 cm）。pelvis は床から約 0.73 m なので z は 車いす用 +0.14〜+0.21、一般用 +0.44〜+0.51
  button_set: general
  wheelchair_max_z_m: 0.32
  # 一般用の ▲ と ▼ の上下の間隔（評価環境は 7〜9 cm。▼ と車いす用の ▲ は 20 cm 以上離れている）
  pair_spacing_m: [0.05, 0.12]
  # 押す向き: ボタンのまわりのこの範囲の柱の面に平面を当てはめる
  normal_region_m: 0.06
  # 柱の面として使う、ボタンからの前後の距離（手など手前の物を除く）
  normal_depth_band_m: 0.03
  normal_min_points: 200
  normal_min_inlier: 0.7
  # 正面（+x）からの傾きの上限 [deg]。これより傾いた面は、何か別の物に当てはめたとみなす
  normal_max_tilt_deg: 25

tracking:
  # 新しいフレームで続けて測る数と、そのばらつきの上限
  frames: 3
  max_spread_m: 0.005
  max_normal_spread_deg: 5.0

# ---- 押す（common/elevator_press.py。Yada の評価環境のエージェント contest_agent/ が使う） ----
# configs/press.yaml の ik / press をこの値で上書きする
ik:
  # 50 Hz で少しずつ動く目標を解くので、精度を上げる
  tol_pos_m: 0.0003
  # 指が並ぶ向き（press.level_finger_row）の傾きをここまで許す [deg]。0° ちょうどに縛ると、届く範囲の端で収束しにくい
  row_tol_deg: 6.0

press:
  planner:
    # 手前の点（球の表面がボタンに触れる位置から、押す向きにこれだけ戻る）[m]
    approach_distance_m: 0.06
    # ボタンの面から押し込む深さ [m]。腕の PD が弱い（kp 60）ので、ボタンの沈む量（評価環境は最大 3 mm）より
    # 深く目標を置いて力を出す（Yada の見本のエージェントと同じ 15 mm）。
    # 2026-11-01 の実機: ラボのボタンは硬く、15 mm（本物のボタンの約 11〜15 mm 先）では 1 mm も沈まなかった。30 mm（止める遅れ 40 mm）
    # でも点灯せず、体が 1.13° 反ったので 15 mm に戻した（押す力の上げ方は未定。real/DAILY_LOG_20261101_laptop.md の「エレベーター」）
    press_depth_m: 0.015
    max_press_depth_m: 0.03
    # 押し込みの直線は、壁に触れるのが目的なので、体との衝突だけを調べる
    align_finger: true
  # 中指の先の衝突判定の球の半径 [m]（評価環境の configs/elevator_prod.yaml の fingertip.radius）
  tip_radius_m: 0.008
  # 指の向き: 押す向きから左・上に傾ける（右下から斜めに伸ばす）。正面に向けると、柱の正面に立つため
  # 右腕を体の前に寄せることになり、肘・肩が胴体に当たった（Yada の見本のエージェントの記録、2026-10-02）
  # [左, 上] [deg] の候補を順に試す。最初の 35°/20° は Yada の見本と同じ。柱が近く面が斜めのときは、
  # これでは手首が胴体に近づきすぎた（realistic の seed 8）。端の条件 34 通りで、1 つの傾きで計画が立ったのは
  # 35°/20° 26 通り、45°/20° 32 通り、35°/30° 29 通り、55°/20° 30 通り（2026-10-07）
  finger_tilts_deg: [[35, 20], [45, 20], [35, 30], [55, 20]]
  # 指が並ぶ向き（親指〜小指）を押す面と平行にする（指の軸まわりのねじれを決める）。false ならねじれは自由。
  # 縛った向きで計画が立たなければ、縛らずに計画し直す
  level_finger_row: false
  # IK を始める右腕の姿勢（motor 22〜28）。肘を外に張って腕を上げた姿勢（Yada の見本と同じ。腕を下ろした
  # 姿勢から始めると、肘を内側にたたむ解になり、肩が胴に当たった）
  ik_seed_right_arm: [-1.0, -0.5, 0.3, 0.3, 0.0, 0.0, 0.0]
  # 腕と柱・壁の間に空ける距離 [m]（手前の姿勢へ動く途中）
  wall_clearance_m: 0.01
  # 壁に当たるときに通る経由点: [押す向きに戻る距離, 右へずらす距離] [m] を順に試す。高さの下限は pelvis 基準。
  # 2026-10-07、評価環境の seed 1 の ▼ で、まっすぐ手前の姿勢へ動くと手首が柱の 1.9 mm 手前を通った。
  # 経由点の候補 54 通りを調べ、通れたもののうち壁に近い順に並べた
  via:
    offsets_m: [[0.12, 0.08], [0.12, 0.15], [0.18, 0.15]]
    min_height_m: 0.15
  # 勧める立つ位置。外なら、どちらへ何 cm 動けばよいかを出す（計画できなければ中止の理由に添え、計画できれば注意だけ出して押す。
  # 範囲の外でも押せることは多く、推定の距離は realistic で最大 19 mm 手前にずれるので、これだけでは止めない）。
  # 距離は pelvis から柱の面まで（押す向きに測る）、左右は ▲▼ の中点の pelvis の y。2026-10-15 に確かめた範囲:
  # 計画だけの網羅（▲ の高さ 1.03〜1.10 m・左右 ±3 cm）では 29〜46 cm で全条件が立つ。評価環境（basic）で押すと、
  # 29 cm と 40 cm（高さ 1.03・1.10 m、左右 ±3・±6 cm、▲▼）はすべて点灯。近い側は 27・28 cm で高い ▲ が
  # 「腕が体に当たる・肘の範囲」で計画できないことがあり、遠い側は 41 cm 以上で高い ▲（1.10 m）が頭カメラの上に
  # 切れて見つからない（46 cm 以上では低い ▼ の計画も特異姿勢の近くで立たない）
  stand:
    min_dist_m: 0.29
    max_dist_m: 0.40
    max_side_m: 0.06
  # 押す組（geometry.button_set）ごとに、press の同じ名前の値を置き換える
  by_button_set:
    # ラボの車いす用: 指を押す向きにまっすぐ向け、中指の先で垂直に押す（2026-11-03）。
    # 2026-11-01 の実機は 35°/20°（指が押す向きから約 40° 斜め）で、ねじれが自由なため小指側が 13〜15 mm 前に出て、
    # 小指の先で横から押していた（細い小指が曲がり、点灯しなかった。動画でも下側の指が当たっていた）。
    # 斜めのまま指の並びを変えても、曲がった形のゴムの手では 1 本の指が前に出る差は最大 6〜7 mm（中指なら 0.5 mm）。
    # まっすぐ（0°/0°）なら中指の先が約 4 mm 前に出る。ただし腕が胴に当たらないよう、ボタンを体の右寄りにする
    # （11/1 の立ち位置、柱まで約 36 cm・ほぼ正面では立たない）。
    wheelchair:
      finger_tilts_deg: [[0, 0]]
      level_finger_row: true
      # 押し込み終わりから手前の点へ戻る時間 [秒]（既定 1.0）。2026-11-03 の実機（空中のボタン、auto_press.py --air）で、
      # 遠く立つほど戻り始めに肘が速く回り（40 cm 0.73 → 48 cm 1.05 → 50 cm 1.38 rad/s）、体が少し傾いた
      # （腰の回転の最大は戻り始め）。押し込み（press_s 2.5 秒）と同じ速さにする
      retract_s: 2.5
      # 計画で許す関節の速さ [rad/s]（既定は arm.yaml の 0.5）。腕が伸びきる近くの 50 cm の ▼ は、押し込みの最後の点で
      # 関節が 1 周期に 0.0100 rad（0.5 rad/s の上限ちょうど）動き、計画が立ったり立たなかったりした（11/3 の立った姿勢
      # 26 個で 1 回だけ立つ）。0.55 で ▲▼ とも立ち、11/3 の実機（空中のボタン 50 cm）で問題なく動いた。
      # 送るときの頭打ちは run_dds の安全フィルタ（Yada の contest.yaml、1.0 rad/s）。52 cm は 0.6 でも立たない
      max_joint_speed_rad_s: 0.55
      # 勧める立ち位置（2026-11-03。実機の立った姿勢での計画の地図 sim/elevator_stand_map.py --button-set wheelchair と
      # 評価環境のシミュレーション sim/record_trial_video.py --lab-wheelchair で確かめた）。11/1 は腰から柱まで約 36 cm で
      # つま先が壁まで約 16 cm と近すぎたので、離れて押す。
      # 近い側: ボタンが右 12 cm より内側だと手首・肘が胴に当たり、右 16 cm より外側だとボタンが頭カメラの画像から出る。
      #   その間なら柱まで 28〜30 cm まで計画が立つ（28 cm・右 16 cm では ▲ が画像の端にかかり、左右が 9 mm ずれた）。
      # 遠い側: 48〜50 cm は柱の面の一部が画像から出るが押せた（50 cm・右 12 cm で ▲▼ とも点灯。実機の立った姿勢では
      #   50 cm の ▼ に max_joint_speed_rad_s 0.55 が要る）。52 cm から腕が
      #   伸びきる近くで押し込みの途中に関節が急に動き（押す速さを 1/4 にしても同じ）、56 cm から ▲ が画像の上に出る。
      #   肩（pelvis から z +0.29、右 0.10 m）から押し込み終わりまで、55 cm では 57〜59 cm（実測の腕の長さ約 60 cm）。
      stand:
        min_dist_m: 0.30
        max_dist_m: 0.50
        # 立つときの目安（つま先から壁まで約 28 cm）。置く位置のずれ（2 cm 程度）でも範囲に入る
        target_dist_m: 0.48
        # 左右は、▲▼ の中点の pelvis の y がこの値から max_side_m 以内（− が体の右）
        center_side_m: -0.14
        max_side_m: 0.02
  # 時間 [秒]
  look_start_s: 0.2
  look_timeout_s: 3.0
  settle_s: 1.0
  press_s: 2.5
  hold_s: 0.6
  retract_s: 1.0
  check_wait_s: 0.3
  # 画像を撮った時刻が観測に無いとき（評価環境の実機用の口は 0 のまま）、この間隔ごとに新しい画像とみなす [秒]。
  # 頭カメラのサーバは 10〜30 fps
  image_interval_s: 0.1
  # 関節空間の移動の速さの目安 [rad/s]（評価環境のランナーの上限 1.0 rad/s より遅く）と、最短の時間 [秒]
  move_speed_rad_s: 0.8
  min_move_s: 1.5
  # 指先のずれの補正（積分）。gain [1/s]、上限 [m]、ボタンの面からこの距離より近づいたら止める [m]
  servo:
    gain: 3.0
    max_m: 0.05
    freeze_m: 0.01
    # IK が収束しきらなくても、この誤差より小さければ使う（毎周期解き直すため）
    accept_err_m: 0.01
  # 点灯の確認: ボタンの明るい部分の明るさ（枠に内接する楕円を radius 倍に広げた範囲の、明るい側から percentile %
  # の値。0〜255）が、見つけたときよりこれだけ上がれば点灯とみなす（common/elevator_press.py の _lit_level）。
  # ラボのエレベーター（2026-10-15、スマホの写真 5 枚）は縁の細い輪だけが光り、枠全体の平均では +21〜+31 しか
  # 上がらなかった（以前のしきい値 +25 でぎりぎり）。明るい部分なら +51〜+95。評価環境（basic・realistic 各 20 配置、
  # classic・YOLO、点灯で終わらせない診断）では、点灯したとき +39〜+55、点灯していないとき 1 以下
  lit_check:
    radius: 1.15
    percentile: 90
    min_rise: 30
    # 押す前から金属の面が反射で白い（194〜215）ボタン用の第 2 の条件: 明るさが abs_level 以上で、上がり方が abs_min_rise 以上。
    # 2026-10-19 のスマホの写真 57 枚で、点灯 224〜230・反射の消灯は最大 215（余裕は両側で 4〜5）。実機のカメラの露出は違うので、
    # 実機日の画像（lit_log.json）で確かめる。使いたくないときは abs_level を 256 にする
    abs_level: 220
    abs_min_rise: 6
    # 押す前（見つけたとき）の明るさがこれ以上なら「押す前から点灯している」とみなし、押さずに終わる（common/elevator_press.py の
    # _look）。押すと、かごが着いてランプが消えたときに「点かなかった」と判定して押し直してしまう（2026-11-03 の 19:45 の ▲）。
    # 11/3 の頭カメラ（RealSense のカラー）: 押す前の消灯 59〜79、点灯 232〜235、押す前から点灯 234
    # （tests/data/lab_elevator_head/）。スマホの写真の反射で白い消灯（最大 215）を点灯と取り違えないよう、それより上にする。
    # 取り違えると押さずに終わるので、見逃す側（点灯 224 のスマホの写真は見逃す）に寄せた。使いたくないときは null
    prelit_level: 225
  # 点灯を見る枠は、今の画像でボタンを見つけ直して決める（腕を動かすと体が揺れて画像がずれ、見つけたときの枠が
  # ボタンから外れた。2026-10-14、realistic の seed 10 で約 25 px）。見つけたときの枠の中心からこの距離 [px] 以内・
  # 幅と高さの比がこの倍率以内の候補で、最も近いもの。無ければ見つけたときの枠のまま
  lit_track:
    max_shift_px: 40
    max_size_ratio: 1.6
  # 押し込みの途中で、指令した指先が実際の指先より押す向きに lag_m 以上先に出たら（ボタンが底に着いた・何かに
  # 当たった）、押し込みを止め、実際の指先の keep_m 先（＋押す前からある遅れの分）を押したまま保持する。押し直しのときは retry_lag_m（強めに押す）。
  # 2026-10-15、評価環境で、触れる前の遅れは最大 1.9 mm、底に着くと 0.1 秒で 5〜8 mm、止めないと 26 mm まで増え、
  # 指先がボタンの面を横に滑って柱の穴の縁を最大 21.6 N で押した（realistic の seed 0・6・7）
  # 遅れは、押し込みを始めた周期の遅れからの増え方で見る（2026-10-21、実機は重力補償 0.5 で押す前から 4.5 mm
  # 遅れていて、絶対値 5 mm では約 1 mm 進んだだけで止まった）
  # 2026-11-01 の実機: 5 mm では、空中で加速しているだけで遅れが 5.6 mm 増え、ボタンの約 1.5 cm 手前で止まった。10 mm では
  # 位置は合ったが押す力が足りず、点灯しなかった。20 mm・40 mm（保持 8 mm）も試したが点灯せず、40 mm では指先が塞がれても
  # 早めに止まる守りが働かないので、実機で当たって止まるのを確かめた 10 mm（ボトルと同じ）にした
  contact_stop:
    lag_m: 0.010
    retry_lag_m: 0.013
    keep_m: 0.002
  # 点灯していなければ、この深さだけ深くして押し直す（回数の上限）
  # 実機で最初に送るときは 0 にする（点灯の確かめ方が本物のボタンで合っているか分からないため。手順書の段階7の 4.）
  max_retries: 1
  retry_extra_depth_m: 0.01

# 柱（とその奥の壁）を表す箱（common/elevator_press.py の wall_obstacle）
wall:
  # ボタンの中央から左右・上下の半分の大きさ [m]
  half_width_m: 0.5
  half_height_m: 0.6
  thickness_m: 0.2
  # 箱の前面を、柱の面からこれだけ奥にする [m]（ボタンは柱の面から 0.5〜3 mm 出ているだけ）
  margin_m: 0.0
  # 移動の途中を調べる点の数
  path_samples: 20
