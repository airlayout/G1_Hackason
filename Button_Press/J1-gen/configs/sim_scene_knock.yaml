# Button_Press / MuJoCo のシーン（ボトルを倒す動作用）。sim_scene.yaml との違いは、ボトルが倒れる自由物体であること。
# 位置は pelvis 座標 [m]（x 前方、y 左、z 上）。シミュレーションでは pelvis を固定している。

detection_pose_deg:
  15: 11.5
  16: 20.0
  18: 86.0
  22: 11.5
  23: -20.0
  25: 86.0

table:
  # 天板の上面の中心と、天板の大きさ（半分の長さ）。手前の縁は x = 0.50 − 0.20 = 0.30
  top_center: [0.50, -0.10, -0.05]
  half_size: [0.20, 0.35, 0.02]
  rgba: [0.55, 0.45, 0.35, 1.0]
  # 木の机と PET の摩擦係数のおおまかな値（MuJoCo は接する 2 つの geom の大きいほうを使う）
  friction: 0.4

bottle:
  # 底の中心の位置（x, y）。机の手前の縁（x = 0.30）にぎりぎり置く（縁からボトルの面まで約 1 cm）
  xy: [0.343, -0.20]
  # 500 mL の PET ボトルのおおまかな寸法 [m]。胴の半径 3.25 cm、全体の高さ 約 20 cm
  radius: 0.0325
  body_height: 0.14
  neck_radius: 0.013
  neck_height: 0.04
  cap_height: 0.02
  body_rgba: [0.85, 0.15, 0.15, 1.0]
  neck_rgba: [0.75, 0.85, 0.95, 0.6]
  cap_rgba: [0.1, 0.3, 0.8, 1.0]
  # ここから下が倒れる物体の設定
  free: true
  # 空のボトル（キャップ込み）の質量 [kg]
  shell_mass_kg: 0.02
  # 中の水 [mL]。底にたまる（1 mL = 1 g）
  water_ml: 50.0
  # ボトルと机・ハンドの摩擦係数
  friction: 0.4
