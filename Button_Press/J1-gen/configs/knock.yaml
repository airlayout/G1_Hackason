# Button_Press / ボトルを倒す動作の設定。press.yaml・localize.yaml・pipeline.yaml に重ねる（--overlay knock.yaml）。
# 座標は pelvis 基準 [m]。ここに無い値は、元の設定ファイルのまま。
#
# 倒し方: ボトルの胴の上のほうを、水平に前方（ロボットから遠ざかる向き）へ押して、机の上に倒す。
#
# 【力学】500 mL の PET ボトル（胴の半径 r = 3.25 cm）を、底から高さ h の点で水平に押す。
#   - 滑らずに倒れる条件は h > r/μ（μ は底と机の摩擦係数）。μ = 0.4 なら h > 8 cm。低いと机の上を滑るだけ
#   - 倒すのに要る力は約 0.2 N と小さい。押す力・腰のずれは問題になりにくい
#   - ⚠️ 倒れきる角度は、重心の高さで決まる。水 50 mL を入れると重心が底から約 3 cm まで下がり、角度は約 45°
#     （空のボトルの 2 倍以上）。そこまで傾けるのに、手先は約 9 cm 以上進む。最初の見積もり（22°・5 cm）は誤りだった
#
# 【MuJoCo の掃引（sim/knock_sweep.py、2026-10-22）】机の手前の縁に置いたボトル（水 50 mL・殻 20 g）、立った状態の右腕
#   - 押し込み 8 cm: 倒れない（最大 44° まで傾いて戻る）。10〜12.5 cm なら倒れる
#   - 押し込みが 14 cm 以上: 腕が伸びきって計画できない（関節の動きの上限、肘の可動範囲）。上限は約 13 cm
#   - 押す点を高くするほど、倒すのに必要な押し込みが増える（高さ 12 cm で約 9 cm、16 cm で約 13 cm）。
#     低いと滑る（摩擦 0.3 では測った点 + 5 cm 未満で滑った）。この間の窓は狭い（± 5 mm で外れる）
#   - 下の値（押し込み 12.5 cm、上げ 58 mm）は、摩擦 0.3〜1.0、水 25〜100 mL のすべてで倒れた。摩擦 0.25 では滑る
#   - 滑り止めのマット（摩擦 0.8 以上）の上なら、上げ 0〜40 mm・押し込み 10 cm でも倒れる（窓が広い）。実機ではこれを勧める
#   - 空のボトル（水 0 mL）は重心が高く、上げ 50〜80 mm で倒れる。窓は広いが、勢いよく飛ぶことがある
press:
  press:
    # 押し込みの深さ。ボトルの面に触れてからさらに進める距離（上の掃引）
    press_depth_m: 0.125
    # 空振りしたときに腕が伸びすぎないための上限（これ以上は腕が届かない）
    max_press_depth_m: 0.14
    # 準静的に倒すので遅めにする（速いとボトルが飛ぶ）
    press_speed_m_s: 0.05
    # 倒したらすぐ戻る
    hold_s: 0.0
  # 押し直しはしない（倒れたかは post_check ではなく、動作の最後に tip_check で自動判定する）
  post_check:
    max_retries: 0

localize:
  depth:
    # 枠の中の深度を取る点（幅・高さに対する割合）。胴の面（首のくびれより下）で測る。細い首や透明な部分は深度が取りにくい
    anchor: [0.5, 0.55]

pipeline:
  target:
    depth:
      # 測った面の点から上へ上げて、ボトルの上のほうを押す。
      # ハンドの当たり判定（シミュレーションは手を包む箱）は、中指の先より約 4.5 cm 下まで広がる。指先を胴の中ほどに
      # 合わせると、手の下側が低い所に当たり、倒れずに滑った（MuJoCo、接触は底から約 9 cm）
      # ⚠️ 実機は、手の当たる高さがシミュレーションの箱と違う。dry-run と実機の様子を見て、この値を調整する
      offset_m: [0.0, 0.0, 0.058]

  # 倒れたかの自動判定（common/tip_check.py）。ボトルのいちばん高い点の高さを、押す前と押したあとで比べる
  tip_check:
    # 検出した枠の上端から、枠の高さのこの割合の帯の深度を使う
    top_strip_fraction: 0.15
    # この範囲の深度だけを使う [m]（D435 はおよそ 0.2 m 未満を測れない）
    min_m: 0.15
    max_m: 1.5
    # 帯で有効な深度の画素がこれより少なければ「判定できない」
    min_valid_pixels: 20
    # 帯の中の最も手前の深度からこの範囲の画素だけをボトルとして使う（それより奥は背景）[m]
    near_band_m: 0.04
    # いちばん高い点がこれ以上下がったら「倒れた」（立っていれば約 20 cm、寝ていれば約 6.5 cm で、差は約 13 cm）
    fallen_drop_m: 0.06
    # この範囲の変化なら「立っている」。間は「傾いている」
    standing_tolerance_m: 0.03
