# G1 用の Nav2 設定。2026-09-06 に記録 20260906T135940_UiS_room_v3 の再生で組んだ。
#
# ## この設定が前提にしているもの
#
# - TF は `odom_to_tf.py --nav2-frames` が出す（map -> odom は恒等、odom -> base_link は
#   内蔵SLAM の /unitree/slam_mapping/odom）。G1 は /tf を一切出さないので必須
# - 障害物は生 LiDAR `/utlidar/cloud_livox_mid360` から取る。
#   **地図点群 /unitree/slam_mapping/points は header.stamp=0 なので使えない**
#   （コストマップはメッセージ時刻で TF を引くため）
# - 静的レイヤは octomap_server が出す /projected_map を使う
#
# ## 値の根拠と未確定なところ
#
# - `robot_radius` は 0.30m。2026-09-07 に**地図の連結性を測って決めた**。
#   0.35m だと機体の居る島が 11,157 セルに孤立し、主要な通行領域（203,611 セル）から
#   切り離される（機体位置の静的地図クリアランスが 0.36m で閾値の際だった）。
#   0.30m 以下なら地図全体（約 2,215 m^2）が 1 つに繋がる。
#   G1 の肩幅は約 0.45m ＝ 必要半径 0.23m なので 0.30m でも 3 割の余裕がある
# - 速度上限は**安全側の仮値**。公式の速度域は Go2/Go2_W 用（0.2〜0.8 m/s）しか無く、
#   二足の G1 で同じ保証は無い。実機で下から上げて決める
# - `obstacle_max_range` は 2.0m。OctoMap の掃引で maxRange 2m が誤除去最少だった
#
# ## ⚠️⚠️ 2026-09-08: **経路が引けない主因はこのファイルではない。地図である**
#
# 再生でこのファイルの設定を検証したところ（段 B。実機不要）、
# **機体セルは静的地図 `/map` でも local costmap でも常に 0（自由）なのに、
# global costmap だけが 0 と 99 を行き来し、planner が 10 回中 6 回失敗した。**
# 機体の周り ±0.60 m に致死セルが 1〜5 個あり、その膨張が機体を囲んでいた。
#
# 原因を地図と軌跡だけで測った（ROS 不要・2 分）:
#
#   nav_map.pgm の占有セルまでの距離を、**機体が実際に歩いた軌跡の全 5,670 点**で測る
#     中央値 0.200 m / 25%分位 0.100 m / 5%分位 0.000 m
#     → **軌跡の 73.1% が占有セルから 0.30 m 未満**（robot_radius 0.30 の内接円に触る）
#
# つまり**事前地図が自分の歩いた道を塞いでいる。** planner や robot_radius の
# 調整では直らない（0.35 なら 77.3%、0.45 なら 86.2% と悪化するだけ）。
#
# **床が原因ではない。** 障害物帯の下端を 0.15 → 0.50 m まで上げても
# 73.1% → 68.1% しか動かない（占有セルは 24,370 → 21,065）。
# 0.15〜1.80 m の帯にある実体（追従者・家具）が軌跡沿いに焼き込まれている。
# → **直すのは `pcd_to_occupancy.py` に食わせる点群**（動的点の除去）であって、
#    このファイルの値ではない。だから 2026-09-08 は値を変えていない。
#
# 測り方: `quickstart/check_planning.py`（**1 回ごとに姿勢を読み直す**版）
#   （2026-09-06 実測）ことに合わせた

amcl:
  ros__parameters:
    use_sim_time: true
    # 使わない。自己位置は内蔵SLAM が map 系で出しており、map -> odom は恒等でよい。
    # 起動はするが tf を出さない設定にはできないので、bringup からは外して使う

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /unitree/slam_mapping/odom
    bt_loop_duration: 10
    default_server_timeout: 20

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 10.0        # LiDAR が 10Hz なのでそれ以上にしても意味が無い
    min_x_velocity_threshold: 0.02
    min_y_velocity_threshold: 0.02
    min_theta_velocity_threshold: 0.05
    failure_tolerance: 0.3
    odom_topic: /unitree/slam_mapping/odom
    progress_checker_plugin: progress_checker
    goal_checker_plugins: [general_goal_checker]
    controller_plugins: [FollowPath]

    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.5
      movement_time_allowance: 15.0
    general_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.30         # 二足なので厳しくしない
      yaw_goal_tolerance: 0.35
      stateful: true

    FollowPath:
      # RPP は非ホロノミック前提だが、まず素直な挙動で通す。
      # G1 は横移動(vy)もできるので、詰めるなら MPPI に替えて omni を有効にする
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 0.30        # ⚠️ 仮。実機で決める
      lookahead_dist: 0.8
      min_lookahead_dist: 0.4
      max_lookahead_dist: 1.2
      use_velocity_scaled_lookahead_dist: true
      transform_tolerance: 0.3        # 歩行中は odom が揺れるので緩めに取る
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.5
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.15
      use_rotate_to_heading: true
      rotate_to_heading_angular_vel: 0.5    # ⚠️ 仮
      max_angular_accel: 1.0
      allow_reversing: false          # 後方センサ上部が死角なので後退はしない

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 8
      height: 8
      resolution: 0.10
      robot_radius: 0.30              # 連結性の実測で決めた（冒頭の注記）
      plugins: [voxel_layer, inflation_layer]
      voxel_layer:
        plugin: nav2_costmap_2d::VoxelLayer
        enabled: true
        publish_voxel_map: true
        # ⚠️ 下端を 0 にすると LiDAR 自身が範囲外になり、レイキャストが一切できない
        # （2026-09-06 のオフライン検証で "Sensor origin ... is out of map bounds" が出た）。
        #
        # ⚠️⚠️ **高さ帯は map 系の z なので、読ませる .mm と必ず一対で動かす。**
        # MOLA-LO 測位は ignore_lidar_pose_from_tf:=true で base_link ≡ livox_frame
        # なので、map の z 原点は「地図を作ったときの初期姿勢の z」で決まる。
        #
        #   runs/<S>/mola_floor0/map.mm … MOLA_INITIAL_Z=1.228（床上高さ）で作り直した。
        #                                 **床が z≈0**。下の値はこちら用（自然な値に戻した）
        #   runs/<S>/mola_aligned/map.mm … 旧。MOLA_INITIAL_Z=-0.0437 なので**床が z≈-1.2**。
        #                                 使うなら origin_z -1.40 にし、帯は 1.30 m 下げる
        #                                 （実測の z 差。0.23 → -1.07 / 1.80 → 0.50）。
        #                                 ⚠️ 旧記載の -1.10 は**床の振れ幅を知る前の値**で
        #                                 余裕がほぼ無く、間欠失敗が再発する。測り直すこと
        #
        # ⚠️⚠️ **min_obstacle_height は「床の振れ幅」から決める。固定値を焼かないこと。**
        # MOLA の絶対 z は歩行中に振れる（2026-09-07 実測: 590 秒で **0.119〜0.149 m**、
        # 床の高さが +0.006 〜 +0.126 を行き来した）。センサ→床の距離自体は姿勢依存でもあり
        # （G1 は二足なので立ち方で胴体高さが変わる）、定数にできない。
        # **この帯が床の最大値を下回ると、床が間欠的に障害物として撃たれて機体が囲まれ、
        # 経路が引けなくなる**（2026-09-07 に planner が 5 回中 1〜4 回しか通らなかった機構）。
        # 下の 0.23 は quickstart/check_calibration.py が算出した値
        # （床の最大 +0.126 に 10cm の余裕）。**記録や地図を替えたら測り直すこと**:
        #   check_calibration.py <bag> --traj <traj.txt> --pcd <map.pcd>
        # 同時に「向きのcalibration」と「z 原点」も判定してくれる
        # （2026-09-07: 傾き最大 0.79 deg・床の中央 +0.046 m でどちらも OK）。
        origin_z: -0.60
        z_resolution: 0.15
        z_voxels: 16                  # -0.60 .. +1.80。LiDAR 自身の z≈+1.26 を含む
        max_obstacle_height: 1.80     # 天井は入れない
        mark_threshold: 1
        observation_sources: livox
        livox:
          topic: /utlidar/cloud_livox_mid360
          data_type: PointCloud2
          sensor_frame: livox_frame
          marking: true
          clearing: true
          min_obstacle_height: 0.23   # 床(z≈0)の振れ幅から算出。上の注記を読むこと
          max_obstacle_height: 1.80
          obstacle_max_range: 2.0
          obstacle_min_range: 0.30    # 至近は機体自身が写る
          raytrace_max_range: 3.0
          raytrace_min_range: 0.30
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0
        inflation_radius: 0.55

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      resolution: 0.10
      track_unknown_space: true
      robot_radius: 0.30              # 連結性の実測で決めた（冒頭の注記）
      plugins: [static_layer, voxel_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
        # 過去に作った地図（OctoMap で掃除済み）を map_server で /map に流して使う。
        # octomap_server の /projected_map は走りながら育つので部屋の全体像を持てない。
        # 先に読ませておけば、まだ見ていない場所も含めて経路を引ける
        map_topic: /map
      voxel_layer:
        plugin: nav2_costmap_2d::VoxelLayer
        enabled: true
        publish_voxel_map: true
        # ⚠️ 下端を 0 にすると LiDAR 自身が範囲外になり、レイキャストが一切できない
        # （2026-09-06 のオフライン検証で "Sensor origin ... is out of map bounds" が出た）。
        # ⚠️ 高さ帯は map 系の z。**読ませる .mm と一対で動かす。**根拠は local_costmap 側の注記
        origin_z: -0.60
        z_resolution: 0.15
        z_voxels: 16
        max_obstacle_height: 1.80
        mark_threshold: 1
        observation_sources: livox
        livox:
          topic: /utlidar/cloud_livox_mid360
          data_type: PointCloud2
          sensor_frame: livox_frame
          marking: true
          clearing: true
          min_obstacle_height: 0.23
          max_obstacle_height: 1.80
          obstacle_max_range: 2.0
          obstacle_min_range: 0.30
          raytrace_max_range: 3.0
          raytrace_min_range: 0.30
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0
        inflation_radius: 0.55

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 1.0
    planner_plugins: [GridBased, Smac2D]
    GridBased:
      plugin: nav2_navfn_planner/NavfnPlanner
      tolerance: 0.5
      use_astar: true
      allow_unknown: true             # 未知を通す。広い部屋で証拠が薄いため
    # 予備の planner。
    #
    # ⚠️⚠️ **2026-09-09: 下の「常用しないこと」は再計測待ちで保留中。**
    # Isaac Sim の長距離ナビ（直線 15〜20 m・測位を真値固定）で測ると
    # **結論が逆になった: Smac2D 3/3 到達・NavFn 0/3**。
    # 1 区間目は出発地点もゴールも同一で、NavFn が 899.7 s で残り 2.95 m の
    # 時間切れだった区間を Smac2D は 203.1 s で残り 0.04 m まで詰めている。
    # 勝ち方は「速い」ではなく「詰まっても抜ける」（計画失敗 18 回すべてを
    # リカバリ後の再探索で解いた）。詳細は
    # docs/作業ログ/2026-09-09_1_プランナ比較_Smac2Dで到達.html
    #
    # **方針: 下の実機計測（2026-09-07）を誤りとみなして実機で再計測する（未実施）。**
    # 再計測が済むまで「Smac2D は実機で負ける」を前提にしない。
    # ただし却下の理由は消さずに残す（消すと誰かが同じ道を再採用するため）。
    #
    # 入れた経緯: NavFn（GridBased）は**4連結**で伝播する。2026-09-07 に実機で、
    # 機体の区画からの脱出口が**斜めだけの隘路**になった瞬間があり、そのときの
    # コストマップでは 8連結なら 218,641 セル到達・4連結だと 25 セルで詰みだった
    # （planner は 6ms で "failed to create plan" を返す）。
    # そこで 8連結の Smac2D を足したが、**実測では逆に悪かった**:
    #   同じゴールに 5 回投げて Smac2D 1/5 成功・GridBased 4/5 成功（2026-09-07）。
    # 斜め隘路は本当に起きるが**支配的な要因ではない**。効いているのは、
    # 立脚中の機体が揺れることと、散らかった場所でライブ層の障害物が出入りして
    # コストマップが毎秒変わることで、**開けた場所に機体を置くのが本筋の対策**。
    #   使うとき: ros2 action send_goal /compute_path_to_pose ... "{..., planner_id: 'Smac2D'}"
    Smac2D:
      plugin: nav2_smac_planner/SmacPlanner2D
      tolerance: 0.5
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 10.0
      cost_travel_multiplier: 2.0
      use_final_approach_orientation: false
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10

behavior_server:
  ros__parameters:
    use_sim_time: true
    local_costmap_topic: local_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_costmap_topic: global_costmap/costmap_raw
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: [spin, backup, wait]
    spin:
      plugin: nav2_behaviors/Spin
    backup:
      plugin: nav2_behaviors/BackUp
    wait:
      plugin: nav2_behaviors/Wait
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.3
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.5           # ⚠️ 仮
    min_rotational_vel: 0.1
    rotational_acc_lim: 1.0

waypoint_follower:
  ros__parameters:
    use_sim_time: true
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: true
      waypoint_pause_duration: 2000   # 各点で 2 秒止まる

velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 10.0
    scale_velocities: false
    feedback: OPEN_LOOP
    max_velocity: [0.30, 0.20, 0.50]  # ⚠️ 仮。vx, vy, vyaw
    min_velocity: [-0.10, -0.20, -0.50]
    max_accel: [0.5, 0.5, 1.0]
    max_decel: [-0.8, -0.8, -1.5]
    odom_topic: /unitree/slam_mapping/odom
    odom_duration: 0.1
