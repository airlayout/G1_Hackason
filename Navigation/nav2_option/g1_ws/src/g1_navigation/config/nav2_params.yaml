# Nav2設定ファイル(下書き)。Planning.md D-14/D-15/D-21/D-22/D-23の決定に対応。
#
# footprint は仮値([[0.25,0.20],[0.25,-0.20],[-0.25,-0.20],[-0.25,0.20]])。
# 実測(歩容中の脚の包絡線、Phase 2b)後に置き換えること。
#
# トピック構成(仕様書5.1に対応。実際の remap は launch/navigation.launch.py で行う):
#   controller_server(/cmd_vel_nav) -> velocity_smoother -> /cmd_vel_smoothed -> g1_cmd_router

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    enable_stamped_cmd_vel: true  # D-23
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5  # D-15: vy無効なので実質使われない
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.05
      movement_time_allowance: 10.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.20  # 仕様書9.2
      yaw_goal_tolerance: 0.20
      stateful: true

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"  # D-22
      desired_linear_vel: 0.15
      max_linear_accel: 0.20  # D-16のmax_ax相当(仮値)
      max_linear_decel: 0.20
      lookahead_dist: 0.6
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.9
      use_velocity_scaled_lookahead_dist: false
      min_approach_linear_velocity: 0.03  # D-14のデッドバンド閾値と整合させた仮値
      approach_velocity_scaling_dist: 0.6
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.05
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.785
      max_angular_accel: 0.40  # D-16のmax_awz相当(仮値)
      max_robot_pose_search_dist: 5.0

# D-21: Local costmapは3D点群ベース(voxel_layer)。2D /scan はGlobal専用にする
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      footprint: "[[0.25, 0.20], [0.25, -0.20], [-0.25, -0.20], [-0.25, 0.20]]"
      plugins: ["voxel_layer", "inflation_layer"]
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        publish_voxel_map: true
        origin_z: 0.0
        z_resolution: 0.1
        z_voxels: 16  # nav2_costmap_2dのVoxelGrid実装上の上限(16)。max_obstacle_height=1.8mに対し0.1125m/voxel相当
        max_obstacle_height: 1.8
        mark_threshold: 0
        observation_sources: "pointcloud"
        pointcloud:
          topic: /g1/points_local
          data_type: "PointCloud2"
          min_obstacle_height: 0.05
          max_obstacle_height: 1.8
          obstacle_max_range: 5.0
          obstacle_min_range: 0.0
          raytrace_max_range: 5.5
          raytrace_min_range: 0.0
          clearing: true
          marking: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.40  # 姉妹Navigation班の実測根拠(肩幅+定位誤差+歩容の揺れ)を踏襲
      always_send_full_costmap: true

# D-21: Global costmapは既知地図(A-7で生成)+ 2D scanでの壁検出のみ
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      footprint: "[[0.25, 0.20], [0.25, -0.20], [-0.25, -0.20], [-0.25, 0.20]]"
      resolution: 0.05
      track_unknown_space: true  # 未観測を自由と誤判定しない(A-7の設計方針と整合)
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: "scan"
        scan:
          topic: /scan
          data_type: "LaserScan"
          max_obstacle_height: 2.0
          clearing: true
          marking: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.40
      always_send_full_costmap: true

map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: "test_room.yaml"  # launchで絶対パスに置換される

planner_server:
  ros__parameters:
    use_sim_time: false
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.3
      use_astar: false
      allow_unknown: false  # 未観測を通行可能扱いしない(A-7と同じ方針)

behavior_server:
  ros__parameters:
    use_sim_time: false
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    wait:
      plugin: "nav2_behaviors::Wait"
    global_frame: odom
    robot_base_frame: base_link

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    enable_stamped_cmd_vel: true  # D-23
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.20, 0.0, 0.30]  # D-15: vy=0
    min_velocity: [-0.20, 0.0, -0.30]
    max_accel: [0.20, 0.0, 0.40]
    max_decel: [-0.20, 0.0, -0.40]
    odom_topic: "/odom"
    odom_duration: 0.1

lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: false
    autostart: true
    node_names:
      - map_server
      - controller_server
      - planner_server
      - behavior_server
      - bt_navigator
      - velocity_smoother
