# 実機データで Nav2 の配線を通すための最小構成（Humble の Nav2 1.1.20 向け）。
#
# ⚠️ **これは配線試験用で、本番の設定ではない。**
# 本番設定は `g1_ws/src/g1_navigation/config/nav2_params.yaml`（Jazzy 向け、D-01）。
# 手元の ROS は Mapping の Humble コンテナだけなので、Jazzy 固有の項目
# （`enable_stamped_cmd_vel` 等、D-23）を外した別ファイルにしてある。
#
# ## 実機の実測を反映している箇所
#
# - `obstacle_min_range: 0.35` — 0.0〜0.2m に機体自身が 9,652 点写り、0.2〜0.5m は
#   ほぼ空白（8点）という実測に基づく（findings/g1_dds_sensors.md §2.1.1）
# - voxel_layer の `min_obstacle_height` — 頭部 LiDAR は足元の床が死角（D-21）。
#   床の誤検出より「見えない」ことが問題なので、床すぐ上から拾う
# - `robot_radius` ではなく footprint を使う（nav2_params.yaml と同じ仮値）

planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: false   # 未観測を通らせない（A-7 の3値出力を活かす）

controller_server:
  ros__parameters:
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5     # D-15: MVP は vy=0。横移動は使わない
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 20.0   # 二足は遅い。歩容周期を考えて長めに取る
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.30
      yaw_goal_tolerance: 0.30
      stateful: true
    FollowPath:
      # D-22: Regulated Pure Pursuit から始める（MPPI は Orin NX に重い）
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.3
      lookahead_dist: 0.6
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.9
      use_velocity_scaled_lookahead_dist: false
      transform_tolerance: 0.5
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.1
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.785
      max_angular_accel: 0.5
      max_robot_pose_search_dist: 10.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 8
      height: 8
      resolution: 0.05
      footprint: "[[0.25, 0.20], [0.25, -0.20], [-0.25, -0.20], [-0.25, 0.20]]"
      # D-21: Local costmap は 3D 点群ベース
      plugins: ["voxel_layer", "inflation_layer"]
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        publish_voxel_map: true
        origin_z: 0.0
        z_resolution: 0.10
        z_voxels: 16
        max_obstacle_height: 1.8
        mark_threshold: 0
        observation_sources: mid360
        mid360:
          topic: /utlidar/cloud_livox_mid360
          data_type: "PointCloud2"
          max_obstacle_height: 1.8
          min_obstacle_height: 0.05
          obstacle_max_range: 8.0
          # 実測: 0〜0.2m に機体自身が写る（findings §2.1.1）
          obstacle_min_range: 0.35
          raytrace_max_range: 9.0
          raytrace_min_range: 0.35
          clearing: true
          marking: true
          inf_is_valid: false
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      footprint: "[[0.25, 0.20], [0.25, -0.20], [-0.25, -0.20], [-0.25, 0.20]]"
      resolution: 0.05
      track_unknown_space: true   # 未観測を自由と誤判定しない（A-7 の設計と整合）
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55
      always_send_full_costmap: true

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    wait:
      plugin: "nav2_behaviors/Wait"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.5
    # D-15/ポリシー制約: 後退は死角があるので使わせない前提。値は保守的に
    max_rotational_vel: 0.3
    min_rotational_vel: 0.1
    rotational_acc_lim: 0.5

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    transform_tolerance: 0.5

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.4, 0.0, 0.5]
    min_velocity: [-0.2, 0.0, -0.5]
    # 二足の応答は遅い。加速度は保守的に（Phase 1 の実測で詰める）
    max_accel: [0.5, 0.0, 1.0]
    max_decel: [-0.5, 0.0, -1.0]
    odom_topic: "/odom"
    odom_duration: 0.1
