# api_spec.py から生成（手で編集しない）
openapi: "3.0.3"
info:
  title: "G1 開発コンソール API"
  version: "0.1.0"
  description: "人は画面で状態を把握し、Claude Code / Codex は同じ内容をこの API で読み、操作する。\nx-effect: read=読むだけ / settings=コンソールの設定だけ変える / robot_write=G1 に書く（音・LED） / robot_motion=G1 が動く。\nx-real-robot-verified=false は実機で未確認。エラー: HTTP 400=入力不正 / 404=未定義 / 500=保存失敗 / 502=G1 または Jetson に届かない・G1 が拒否。本文はすべて Error。"
servers:
  - url: "http://127.0.0.1:{port}"
    variables:
      port:
        default: "18790"
tags:
  - name: "ops"
    description: "操作タブ（接続・モード）"
  - name: "state"
    description: "状態タブ"
  - name: "joints"
    description: "関節タブ"
  - name: "audio"
    description: "音声タブ"
  - name: "camera"
    description: "カメラタブ"
  - name: "dds"
    description: "DDS タブ"
  - name: "settings"
    description: "設定タブ"
  - name: "mock"
    description: "--mock のときだけ有効"
paths:
  "/api":
    get:
      operationId: "getApi"
      tags:
        - "ops"
      summary: "この API 定義（OpenAPI, JSON）"
      x-effect: "read"
      responses:
        "200":
          description: "成功"
          content:
            "application/json":
              schema:
                type: "object"
                additionalProperties: true
  "/api/status":
    get:
      operationId: "getStatus"
      tags:
        - "ops"
      summary: "まず最初に読む。接続（jetson/g1）・現在のモード・確認の古さ・自動確認の停止中か"
      x-effect: "read"
      description: "jetson/g1 が ok でなければ、その先の値は信用しない。ok でも age_s が数秒以上なら古い値。paused=true の間は更新されない。"
      responses:
        "200":
          description: "成功"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Status"
  "/api/state":
    get:
      operationId: "getState"
      tags:
        - "state"
      summary: "バッテリー・IMU・オドメトリ・メインボード・Jetson・リモコン・非常停止"
      x-effect: "read"
      description: "notes.units_assumed / notes.unverified に、単位が推定・意味が未確認の項目を列挙している。"
      responses:
        "200":
          description: "成功"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/State"
  "/api/joints":
    get:
      operationId: "getJoints"
      tags:
        - "joints"
      summary: "29 関節の角度・速度・トルク推定・温度・指令値"
      x-effect: "read"
      responses:
        "200":
          description: "成功"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Joints"
  "/api/snapshot":
    get:
      operationId: "getSnapshot"
      tags:
        - "ops"
      summary: "state と joints を 1 回で取得（状況把握はこれ 1 本で足りる）"
      x-effect: "read"
      responses:
        "200":
          description: "成功"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Snapshot"
  "/api/audio/volume":
    get:
      operationId: "getVolume"
      tags:
        - "audio"
      summary: "スピーカー音量を G1 から読む（Jetson 経由で実際に問い合わせる）"
      x-effect: "read"
      responses:
        "200":
          description: "成功"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Volume"
        "502":
          description: "G1 または Jetson に届かない・G1 が拒否"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
    post:
      operationId: "postVolume"
      tags:
        - "audio"
      summary: "音量を設定し、読み戻して一致を確認する"
      x-effect: "robot_write"
      description: "volume_after が指定値と一致していれば反映済み。"
      x-real-robot-verified: false
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/VolumePatch"
            example:
              volume: 40
      responses:
        "200":
          description: "成功"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/VolumeSet"
        "400":
          description: "入力不正"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "502":
          description: "G1 または Jetson に届かない・G1 が拒否"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
  "/api/cameras":
    get:
      operationId: "getCameras"
      tags:
        - "camera"
      summary: "カメラ一覧と、配信が設定済みか（映像は GET /camera/{name}）"
      x-effect: "read"
      responses:
        "200":
          description: "成功"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Cameras"
  "/api/camera/status":
    get:
      operationId: "getCameraStatus"
      tags:
        - "camera"
      summary: "camera_stream の起動状態と、映像デバイスを掴んでいるプロセス（foreign＝自前以外）"
      x-effect: "read"
      responses:
        "200":
          description: "成功"
          content:
            "application/json":
              schema:
                type: "object"
                additionalProperties: true
        "502":
          description: "G1 または Jetson に届かない・G1 が拒否"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
  "/api/lidar/status":
    get:
      operationId: "getLidarStatus"
      tags:
        - "camera"
      summary: "lidar_stream（Jetson の点群配信）の起動状態"
      x-effect: "read"
      responses:
        "200":
          description: "成功"
          content:
            "application/json":
              schema:
                type: "object"
                additionalProperties: true
        "502":
          description: "G1 または Jetson に届かない・G1 が拒否"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
  "/lidar":
    get:
      operationId: "getLidar"
      tags:
        - "camera"
      summary: "lidar 点群の最新 1 フレーム（既定は間引き済み）。float32 little-endian の (x,y,z,intensity) の繰り返し。点数は X-Lidar-Points"
      x-effect: "read"
      description: "座標は livox_frame のまま（単位 m）。G1 の向きに対して傾いている可能性がある。クエリ voxel（ボクセル幅 m、0〜1、0 で間引かない・既定 0.1）と max（上限点数 100〜30000・既定 5000）で間引きの強さを選べる。範囲外は無視して既定値になる。"
      parameters:
        - name: "voxel"
          in: "query"
          required: false
          schema:
            type: "number"
            minimum: 0
            maximum: 1
        - name: "max"
          in: "query"
          required: false
          schema:
            type: "integer"
            minimum: 100
            maximum: 30000
      responses:
        "200":
          description: "点群バイナリ（16 バイト × 点数）。X-Lidar-Seq / X-Lidar-Points / X-Lidar-Age-Ms ヘッダ付き"
          content:
            "application/octet-stream":
              schema:
                type: "string"
        "404":
          description: "lidar 未設定（設定タブで Jetson の IP を入力）"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "502":
          description: "配信元に届かない。lidar_stream が起動しているか確認"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
  "/api/dds":
    get:
      operationId: "getDds"
      tags:
        - "dds"
      summary: "DDS トピックと RPC サービスの台帳（表示済み／未実装／対象外）"
      x-effect: "read"
      responses:
        "200":
          description: "成功"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Dds"
  "/api/buttons":
    get:
      operationId: "getButtons"
      tags:
        - "ops"
      summary: "切り替えできるモード。POST /api/mode の id はここから選ぶ"
      x-effect: "read"
      responses:
        "200":
          description: "成功"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Buttons"
  "/api/features":
    get:
      operationId: "getFeatures"
      tags:
        - "dds"
      summary: "機能ごとの implemented / verified（verified=false は実機で未確認）"
      x-effect: "read"
      responses:
        "200":
          description: "成功"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Features"
  "/api/settings":
    get:
      operationId: "getSettings"
      tags:
        - "settings"
      summary: "接続先の設定（開発用 PC / Jetson / G1 の IP ほか）"
      x-effect: "read"
      responses:
        "200":
          description: "成功"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Settings"
    post:
      operationId: "postSettings"
      tags:
        - "settings"
      summary: "接続先を保存して反映（Jetson を変えると ssh を張り直す）"
      x-effect: "settings"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/SettingsPatch"
            example:
              jetson_host: "192.168.123.164"
              g1_ip: "192.168.123.161"
      responses:
        "200":
          description: "成功"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Settings"
        "400":
          description: "入力不正（IP かホスト名以外、範囲外など。理由が error に入る）"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "500":
          description: "保存できない"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
  "/api/scenarios":
    get:
      operationId: "getScenarios"
      tags:
        - "mock"
      summary: "模擬シナリオの一覧と現在値"
      x-effect: "read"
      x-mock-only: true
      responses:
        "200":
          description: "成功"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Scenarios"
  "/camera/{name}":
    get:
      operationId: "getCamera"
      tags:
        - "camera"
      summary: "カメラ映像（MJPEG のストリーム）。name は GET /api/cameras のキー"
      x-effect: "read"
      parameters:
        - name: "name"
          in: "path"
          required: true
          schema:
            type: "string"
            enum:
              - "std"
              - "d435i"
      responses:
        "200":
          description: "MJPEG ストリーム（終わらない）"
          content:
            "multipart/x-mixed-replace":
              schema:
                type: "string"
                format: "binary"
        "404":
          description: "カメラ未設定または name が不正"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "502":
          description: "配信元に届かない"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
  "/openapi.yaml":
    get:
      operationId: "getOpenapiYaml"
      tags:
        - "ops"
      summary: "この API 定義（OpenAPI, YAML）"
      x-effect: "read"
      responses:
        "200":
          description: "成功"
          content:
            "application/yaml":
              schema:
                type: "string"
  "/api/camera/start":
    post:
      operationId: "postCameraStart"
      tags:
        - "camera"
      summary: "Jetson で camera_stream.py を起動（再起動はしない。他が掴んでいれば失敗しうる）"
      x-effect: "settings"
      responses:
        "200":
          description: "成功"
          content:
            "application/json":
              schema:
                type: "object"
                additionalProperties: true
        "502":
          description: "G1 または Jetson に届かない・G1 が拒否"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
  "/api/camera/stop":
    post:
      operationId: "postCameraStop"
      tags:
        - "camera"
      summary: "camera_stream.py だけを停止（videohub など他のプロセスは止めない）"
      x-effect: "settings"
      responses:
        "200":
          description: "成功"
          content:
            "application/json":
              schema:
                type: "object"
                additionalProperties: true
        "502":
          description: "G1 または Jetson に届かない・G1 が拒否"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
  "/api/lidar/start":
    post:
      operationId: "postLidarStart"
      tags:
        - "camera"
      summary: "Jetson で lidar_stream.py を起動（DDS を購読するだけ。再起動はしない）"
      x-effect: "settings"
      responses:
        "200":
          description: "成功"
          content:
            "application/json":
              schema:
                type: "object"
                additionalProperties: true
        "502":
          description: "G1 または Jetson に届かない・G1 が拒否"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
  "/api/lidar/stop":
    post:
      operationId: "postLidarStop"
      tags:
        - "camera"
      summary: "lidar_stream.py だけを停止"
      x-effect: "settings"
      responses:
        "200":
          description: "成功"
          content:
            "application/json":
              schema:
                type: "object"
                additionalProperties: true
        "502":
          description: "G1 または Jetson に届かない・G1 が拒否"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
  "/api/monitor":
    post:
      operationId: "postMonitor"
      tags:
        - "ops"
      summary: "自動確認・自動再接続の停止／再開、または 1 回だけ確認"
      x-effect: "settings"
      description: "停止中はサーバーが ssh も DDS も叩かない。停止中もモード切替などの明示操作は実行できる。"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/MonitorPatch"
            example:
              paused: true
      responses:
        "200":
          description: "成功"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Monitor"
        "400":
          description: "入力不正"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
  "/api/mode":
    post:
      operationId: "postMode"
      tags:
        - "ops"
      summary: "G1 のモード（FSM）を切り替える。**ロボットが動く**"
      x-effect: "robot_motion"
      description: "受理（set_code=0）は到達ではない。実行後は GET /api/status を繰り返し読み、mode.fsm_id が目標になるか確認する（15 秒を目安）。歩行中（500/501）に切り替えると転倒の恐れがある。実行前に必ず人へ確認する。実機では未検証。"
      x-real-robot-verified: false
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/ModePatch"
            example:
              id: 3
      responses:
        "200":
          description: "成功"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ModeAck"
        "400":
          description: "入力不正（許可されていない id）"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "502":
          description: "G1 または Jetson に届かない・G1 が拒否"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
  "/api/audio/led":
    post:
      operationId: "postLed"
      tags:
        - "audio"
      summary: "頭部 LED の色を設定"
      x-effect: "robot_write"
      description: "code=0 は受理のみ。色が変わったかは目視（読み戻せない）。"
      x-real-robot-verified: false
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/LedPatch"
            example:
              r: 0
              g: 255
              b: 0
      responses:
        "200":
          description: "成功"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Ack"
        "400":
          description: "入力不正"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "502":
          description: "G1 または Jetson に届かない・G1 が拒否"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
  "/api/audio/tts":
    post:
      operationId: "postTts"
      tags:
        - "audio"
      summary: "テキストを読み上げる"
      x-effect: "robot_write"
      description: "code=0 は受理のみ。音が出たかは耳で確認。"
      x-real-robot-verified: false
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/TtsPatch"
            example:
              text: "こんにちは"
              speaker_id: 0
      responses:
        "200":
          description: "成功"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Ack"
        "400":
          description: "入力不正"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "502":
          description: "G1 または Jetson に届かない・G1 が拒否"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
  "/api/scenario":
    post:
      operationId: "postScenario"
      tags:
        - "mock"
      summary: "模擬シナリオを切り替える"
      x-effect: "settings"
      x-mock-only: true
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/ScenarioPatch"
            example:
              scenario: "g1_off"
      responses:
        "200":
          description: "成功"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Scenario"
        "400":
          description: "入力不正"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
components:
  schemas:
    Error:
      type: "object"
      description: "エラー本文（全エンドポイント共通）。G1・Jetson に届かない 502 では ok=false・offline・ssh_exit などの生の情報も付く"
      properties:
        error:
          type: "string"
          description: "平易な日本語の理由"
      required:
        - "error"
      additionalProperties: true
    Link:
      type: "object"
      description: "接続 1 段の状態。jetson が down なら g1 は unknown"
      properties:
        state:
          type: "string"
          description: "ok=届いている / down=届かない / unknown=上流が切れていて見えていない"
          enum:
            - "ok"
            - "down"
            - "unknown"
            - "checking"
        detail:
          type: "string"
          description: "理由（画面の診断文と同じ）"
      required:
        - "state"
        - "detail"
      additionalProperties: false
    Mode:
      type: "object"
      description: "現在のモード"
      properties:
        state:
          type: "string"
          description: "ok=通常モードで FSM ID が取れた / debug=デバッグモード / unknown=取得不可 / none=接続なし"
          enum:
            - "ok"
            - "debug"
            - "unknown"
            - "none"
        label:
          type: "string"
          description: "表示名"
        fsm_id:
          type: "integer"
          description: "FSM ID（state=ok のときだけ）"
        service:
          type: "string"
          description: "モーションサービス名"
        detail:
          type: "string"
      required:
        - "state"
        - "label"
      additionalProperties: false
    Status:
      type: "object"
      description: "接続・モード・鮮度。まず最初に読む"
      properties:
        jetson:
          "$ref": "#/components/schemas/Link"
        g1:
          "$ref": "#/components/schemas/Link"
        mode:
          "$ref": "#/components/schemas/Mode"
        sampled_at:
          type: "number"
          description: "最後に G1 を確認した時刻（epoch 秒）。null=まだ確認していない"
          nullable: true
        age_s:
          type: "number"
          description: "最後の確認から今までの秒数。大きければ古い値"
          nullable: true
        latency_ms:
          type: "integer"
          description: "G1 への往復 ms"
          nullable: true
        last_g1_ok_at:
          type: "number"
          nullable: true
        last_mode:
          type: "object"
          description: "最後に確認できたモード（切断中の参考。現在値ではない）"
          additionalProperties: true
          nullable: true
        paused:
          type: "boolean"
          description: "true=自動確認・再接続を停止中（値は更新されない）"
        poll_interval_s:
          type: "number"
        server:
          type: "object"
          properties:
            backend:
              type: "string"
              description: "接続先の表示"
            mock:
              type: "boolean"
          required:
