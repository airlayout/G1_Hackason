        age_s:
          type: "number"
          description: "最後の確認から今までの秒数。大きければ古い値"
          nullable: true
        battery:
          type: "object"
          description: "soc[%]・voltage・current・temperature（単位は推定。notes 参照）"
          additionalProperties: true
          nullable: true
        imu:
          type: "object"
          description: "rpy[rad]・gyro・accel・temperature"
          additionalProperties: true
          nullable: true
        imu2:
          type: "object"
          additionalProperties: true
          nullable: true
        odom:
          type: "object"
          description: "起動位置からの推定。ドリフトする"
          additionalProperties: true
          nullable: true
        mainboard:
          type: "object"
          description: "value の意味は未確認（生の値）"
          additionalProperties: true
          nullable: true
        system:
          type: "object"
          description: "Jetson の温度・負荷など"
          additionalProperties: true
          nullable: true
        remote:
          type: "object"
