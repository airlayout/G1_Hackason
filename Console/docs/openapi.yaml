          "$ref": "#/components/schemas/Link"
        g1:
          "$ref": "#/components/schemas/Link"
        mode:
          "$ref": "#/components/schemas/Mode"
        sampled_at:
          type: "number"
          description: "最後に G1 を確認した時刻（epoch 秒）。null=まだ確認していない"
          nullable: true
        age_s:
          type: "number"
          description: "最後の確認から今までの秒数。大きければ古い値"
