              items:
                type: "string"
            unverified:
              type: "array"
              items:
                type: "string"
          additionalProperties: false
      required:
        - "jetson"
        - "g1"
        - "mode"
        - "sampled_at"
        - "age_s"
        - "notes"
      additionalProperties: false
    Joints:
      type: "object"
