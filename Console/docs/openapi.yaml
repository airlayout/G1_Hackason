          additionalProperties: true
          nullable: true
        estop:
          type: "object"
          description: "非常停止。受信なし=null"
          additionalProperties: true
          nullable: true
        strings:
          type: "object"
          additionalProperties: true
          nullable: true
        ages:
          type: "object"
          description: "トピックごとの最終受信からの秒数"
          additionalProperties: true
          nullable: true
        notes:
