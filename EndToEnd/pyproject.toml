[project]
name = "g1-e2e"
version = "0.1.0"
description = "Unitree G1 の End to End ニューラルネットワーク制御"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy==2.3.5", "PyYAML==6.0.3"]

[project.optional-dependencies]
sim = [
    "warp-lang==1.13.0", "gymnasium==1.2.1", "prettytable==3.3.0",
    "toml==0.10.2", "lazy-loader==0.5", "trimesh==5.1.0",
    "packaging==26.3", "psutil==7.2.2", "h5py==3.16.0",
    "hidapi==0.15.0", "scipy==1.18.1", "pillow==12.3.0",
]
demo = ["onnxruntime==1.24.2"]
dev = ["pytest==8.4.2", "ruff==0.14.1"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 110
