# 仮想センサーの初期配置。実機D435i/MID-360の校正値・走査方式ではない。
camera:
  width: 128
  height: 128
  period_s: 0.04
  horizontal_fov_deg: 80.0
  near_m: 0.05
  far_m: 30.0
  exposure_iso: 100.0
  exposure_time_s: 0.02
  exposure_f_stop: 5.0
  render_updates: 3
  mount:
    body: torso_link
    position_m: [0.12, 0.0, 0.34]
    rpy_deg: [0.0, 15.0, 0.0]
lidar:
  period_s: 0.1
  channels: 32
  columns: 360
  vertical_fov_deg: [-30.0, 60.0]
  near_m: 0.15
  far_m: 30.0
  mount:
    body: torso_link
    position_m: [0.0, 0.0, 0.50]
    rpy_deg: [0.0, 0.0, 0.0]
# 歩行経路の外側に静的な箱を置き、RGB-D/LiDARに空間的な変化を持たせる。
landmarks: true
