# 取り付けは選択した公式URDFから解決する。個体のbase→sensor校正値ではない。
body_imus:
  # Unitree公式unitree_mujoco: LowState=骨盤、secondary_imu=胸。
  primary: pelvis
  mounts:
    pelvis:
      urdf_joint: imu_in_pelvis_joint
    torso:
      urdf_joint: imu_in_torso_joint
    # MID-360内蔵IMUをLiDARの公称取り付け座標で取得する。
    # 内部IMUとLiDAR光学原点の個体別外部校正は未取得。
    lidar:
      urdf_joint: mid360_joint
camera:
  width: 640
  height: 480
  period_s: 0.03333333333333333
  # G1_IO_SPECIFICATION.md付録B: 個体の640×480 RGB校正。
  pinhole:
    width: 640
    height: 480
    fx: 605.540649
    fy: 605.06488
    cx: 318.624329
    cy: 254.776291
    source: G1_IO_SPECIFICATION.md Appendix B, stream.color 640x480
  near_m: 0.05
  far_m: 30.0
  exposure_iso: 100.0
  exposure_time_s: 0.02
  exposure_f_stop: 5.0
  render_updates: 3
  mount:
    urdf_joint: d435_joint
lidar:
  model: livox_csv
  period_s: 0.1
  pattern_path: assets/cache/sensors/mid360.csv
  # メーカー表は80万点=4秒分。黙ってループして非反復走査と呼ばない。
  repeat_pattern: false
  vertical_fov_deg: [-7.0, 52.0]
  near_m: 0.1
  far_m: 70.0
  mount:
    urdf_joint: mid360_joint
# 歩行経路の外側に静的な箱を置き、RGB/LiDARに空間的な変化を持たせる。
landmarks: true
