# NNの形状と入出力。センサー取得はconfigs/sensors、入力変換はmodels/inputs.py。
width: 256
memory_tokens: 1  # 再帰周期に履歴へ追加するMは1トークン。
layers: 36
heads: 8
ff_multiplier: 4       # 通常FFNの基準倍率。SwiGLUでは2/3を掛けて8D/3とする。
ff_multiple_of: 256    # 中間幅を256単位に切り上げる。D=256では768、gate/up一括幅は1536。
dropout: 0.0
recurrence_period: 2  # 全周期で履歴と観測からMを生成し、2周期に1回だけ履歴に追加。
context_window: 1024  # 保存Mの上限。観測は別枠。queryは今回のMだけを読む。
query_chunk_size: 1024
control_dt_s: 0.02  # 観測のage秒とMの生成周期を共通時間軸に揃える。
rope_base: 10000.0

modalities:
  rgb:
    feature_dim: 768     # 128x128 RGB、16x16パッチ、事前に値域を正規化
    max_tokens: 64
    position_dim: 2
  depth:
    feature_dim: 512     # 128x128、深度m + 画素validの2チャネル
    max_tokens: 64
    position_dim: 2
  lidar:
    feature_dim: 6       # base座標XYZ m、intensity、ring、フレーム内時刻s
    max_tokens: 128      # 選択/集約は入力アダプター側
    position_dim: 3      # 同じbase座標XYZ m
  joints:
    feature_dim: 3       # q rad、dq rad/s、tau N m。スケール調整は入力側
    max_tokens: 29       # G1のSDK順
    learned_positions: true
  imu_pelvis:
    feature_dim: 14      # 姿勢xyzw4、gyro3、比力3、重力方向3、加速度valid1
    max_tokens: 1
  imu_torso:
    feature_dim: 14
    max_tokens: 1
  imu_lidar:
    feature_dim: 14
    max_tokens: 1

queries:
  velocity:
    kind: learned
    num_queries: 1
    output_dim: 3        # base座標 vx m/s、vy m/s、yaw_rate rad/s
  bev:
    kind: coordinate
    coordinate_dim: 3   # 現在のbase座標XYZ m
    coordinate_scale: [0.1, 0.1, 0.5]
    fourier_bands: 6
    output_dim: 32       # LiDAR由来の障害物mapを再構築する特徴。占有head・lossは未実装
  trajectory:
    kind: coordinate
    coordinate_dim: 1   # 現在からの未来時間Δt s。初版は単一の予測軌跡
    coordinate_scale: [0.5]
    fourier_bands: 6
    output_dim: 7        # 現在のbaseに対する未来のXYZ m + quaternion xyzw
    output_transform: pose3d
