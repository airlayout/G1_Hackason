# octomap_server の設定（3D voxel マップ）
#
# nvblox はこの環境に入っていない（Isaac ROS の apt リポジトリ追加が必要）ため
# ROS 2 Jazzy 標準の octomap_server を使う。
#
# パラメータ名は実際に octomap_server_node を起動して `ros2 param list` で
# 確認済み（2026-08-10）。ROS はパラメータ名を間違えても黙って無視するため、
# 推測で書かないこと。実際に filter_ground / publish_2d_projected_map と
# 書いていて誤りだった（正しくは filter_ground_plane、後者は存在しない）。
#
# 入力トピックは /cloud_in（固定）。ros_bridge は /points に配信するので
# run_octomap.sh で remap する。
#
# 起動は run_octomap.sh から行う。
/**:
  ros__parameters:
    # シム内時刻を使う。実時間だとスキャンと姿勢の対応がずれて地図が壊れる。
    # （2D で実際に発生した。/clock は ros_bridge が配信している）
    use_sim_time: true

    # voxel の一辺 [m]。Warehouse は 1430 m2 程度なので 0.10 で足りる。
    # 小さくすると地図は精細になるがメモリと計算が増える。
    resolution: 0.10

    # 地図の基準フレーム。map -> odom は publish_map_odom_tf.py が流す。
    frame_id: map

    # ロボットの基準フレーム。床の除去に使う。
    base_frame_id: base_link

    # 点群の最大採用距離 [m]。LiDAR の最大距離と揃える。
    sensor_model.max_range: 30.0

    # 占有・空きの確率モデル（octomap の既定値に準じる）
    sensor_model.hit: 0.7
    sensor_model.miss: 0.4
    sensor_model.min: 0.12
    sensor_model.max: 0.97

    # 高さの範囲 [m]。床と天井を地図から除外する。
    # G1 の背丈は約 1.3 m なので、2.5 m まで見れば通行判断には十分。
    occupancy_min_z: 0.05
    occupancy_max_z: 2.5

    # 床の点を「障害物」にしないための平面除去。
    # これを切ると床が一面の障害物になり、どこへも進めない地図になる。
    # 正しい名前は filter_ground_plane（filter_ground ではない）。
    filter_ground_plane: true
    ground_filter.distance: 0.08
    ground_filter.angle: 0.15
    ground_filter.plane_distance: 0.10

    # 孤立した voxel（レイキャストのノイズ）を消す
    filter_speckles: true

    # 2D 投影（/projected_map）を毎回作り直す。
    #
    # **true にしてはいけない。** true だと 3D 地図（/octomap_full,
    # /octomap_point_cloud_centers）は正常に作られるのに、/projected_map が
    # 全セル -1（未知）のまま一切埋まらない。Nav2 の costmap はこれを使うため
    # 「3D は動いているのに Nav2 が障害物を認識しない」状態になる。
    #
    # 実測（合成した壁 3200 点を 30 回流した結果）:
    #   true  : voxel 800 個 / projected_map は -1 のみ（占有 0 セル）
    #   false : voxel 800 個 / 占有 40 セル・空き 647 セル（正しい）
    incremental_2D_projection: false

    # 地図を圧縮して保持する（メモリ削減）
    compress_map: true
