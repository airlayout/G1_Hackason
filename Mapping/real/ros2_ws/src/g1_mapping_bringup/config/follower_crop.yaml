# 追従者をセンサ座標系で切り落とす箱。
#
# 2026-09-04 の較正（runs/20260904T175304_static_nofollower と
# runs/20260904T175407_static_follower の差分）で実測した値。
# 同じ場所で人だけを入れ替えた 30 秒 × 2 本を録り、差分の最大塊を追従者とした。
#
#   実測: 距離 中央 1.00m / 方位 円平均 +178.5°（ほぼ真後ろ）/ 円標準偏差 5.5°
#         センサ基準 z −0.04 〜 +1.04m（p5-p95）/ 幅 0.4m・高さ 1.26m
#
# 歩行時は人が揺れる（2026-09-03 実測: 距離 σ=0.27m / 方位の円標準偏差 37°）ので、
# 静止で決めた中心の周りに余裕を持たせてある。
# 2026-09-05 の同一区間 A/B では矩形より後方扇形の方が残像を除去できた。
# 120° / 2.2m はマスク無し比で軌跡近傍の人高さ帯を 54% 削減し、
# 遠方構造点の減少は 3.7%。この値を動的物体除去優先の既定値とする。
#
# 座標系は livox_frame。x=前方 / y=左 / z=上。後方は −x。
crop_follower:
  ros__parameters:
    shape: rear_sector
    min_range: 0.45
    max_range: 2.20
    rear_half_angle_deg: 120.0
    use_sim_time: true
    # 箱の範囲
    min_x: -1.90
    max_x: -0.50
    min_y: -0.80
    max_y:  0.80
    min_z: -0.20
    max_z:  1.20
    # true で「箱の中を捨てる」。false だと箱の中だけ残す
    negative: true
    keep_organized: false
