name: g1-mapping

x-common-environment: &common-environment
  G1_IFACE: ${G1_IFACE:-enp3s0}
  G1_HOST: ${G1_HOST:-192.168.123.164}
  ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
  RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
  CYCLONEDDS_URI: >-
    <CycloneDDS><Domain><General><Interfaces><NetworkInterface
    name="${G1_IFACE:-enp3s0}" priority="default"
    multicast="default" /></Interfaces></General></Domain></CycloneDDS>
  MAPPING_SESSION_ID: ${MAPPING_SESSION_ID:-unknown}
  RAW_POINTS_TOPIC: ${RAW_POINTS_TOPIC:-/utlidar/cloud_livox_mid360}
  RAW_IMU_TOPIC: ${RAW_IMU_TOPIC:-/utlidar/imu_livox_mid360}
  ONBOARD_POINTS_TOPIC: ${ONBOARD_POINTS_TOPIC:-/unitree/slam_mapping/points}
  ONBOARD_ODOM_TOPIC: ${ONBOARD_ODOM_TOPIC:-/unitree/slam_mapping/odom}
  USE_SIM_TIME: ${USE_SIM_TIME:-false}
  CAMERA_ENABLED: ${CAMERA_ENABLED:-true}
  CAMERA_HOST: ${CAMERA_HOST:-192.168.123.164}
  CAMERA_ZMQ_PORT: ${CAMERA_ZMQ_PORT:-5555}
  CAMERA_NAME: ${CAMERA_NAME:-head_camera}
  CAMERA_FRAME_ID: ${CAMERA_FRAME_ID:-camera_color_optical_frame}
  CAMERA_WIDTH: ${CAMERA_WIDTH:-0}
  CAMERA_HEIGHT: ${CAMERA_HEIGHT:-0}
  CAMERA_FX: ${CAMERA_FX:-0.0}
  CAMERA_FY: ${CAMERA_FY:-0.0}
  CAMERA_CX: ${CAMERA_CX:-0.0}
  CAMERA_CY: ${CAMERA_CY:-0.0}
  POINT_TIMESTAMP_MODE: ${POINT_TIMESTAMP_MODE:-auto}
  ALLOW_INFERRED_POINT_TIME: ${ALLOW_INFERRED_POINT_TIME:-true}

x-common-runtime: &common-runtime
  network_mode: host
  ipc: host
  init: true
  environment: *common-environment
  volumes:
    - ${MAPPING_RUNS_DIR:-./runs}:/runs

services:
  session_recorder:
    <<: *common-runtime
    profiles: [onboard, raw, sim]
    image: g1-mapping-common:local
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: base
    command: [/opt/g1/bin/record-topics.sh]
    stop_grace_period: 30s

  session_trajectory:
    <<: *common-runtime
    profiles: [onboard, raw, sim]
    image: g1-mapping-common:local
    command: [/opt/g1/bin/trajectory-writer.sh]
    stop_grace_period: 10s

  camera_bridge:
    <<: *common-runtime
    profiles: [onboard, raw]
    image: g1-mapping-common:local
    command:
      - ros2
      - run
      - g1_mapping_tools
      - zmq_camera_bridge
      - --ros-args
      - -p
      - host:=${CAMERA_HOST:-192.168.123.164}
      - -p
      - port:=${CAMERA_ZMQ_PORT:-5555}
      - -p
      - camera_name:=${CAMERA_NAME:-head_camera}
      - -p
      - frame_id:=${CAMERA_FRAME_ID:-camera_color_optical_frame}
      - -p
      - width:=${CAMERA_WIDTH:-0}
      - -p
      - height:=${CAMERA_HEIGHT:-0}
      - -p
      - fx:=${CAMERA_FX:-0.0}
      - -p
      - fy:=${CAMERA_FY:-0.0}
      - -p
      - cx:=${CAMERA_CX:-0.0}
      - -p
      - cy:=${CAMERA_CY:-0.0}

  onboard_client:
    <<: *common-runtime
    profiles: [onboard]
    image: g1-mapping-onboard:local
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: onboard
    entrypoint: [/opt/g1/bin/onboard-entrypoint.sh]
    command: [probe]

  onboard_pipeline:
    <<: *common-runtime
    profiles: [onboard]
    image: g1-mapping-onboard:local
    command:
      - ros2
      - launch
      - g1_mapping_tools
      - normalized_mapping.launch.py
      - source_odom:=${ONBOARD_ODOM_TOPIC:-/unitree/slam_mapping/odom}
      - source_cloud:=${ONBOARD_POINTS_TOPIC:-/unitree/slam_mapping/points}
      - use_sim_time:=false
    stop_grace_period: 10s

  raw_tools:
    <<: *common-runtime
    profiles: [raw, sim]
    image: g1-mapping-raw:local
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: raw
    command: [bash]

  raw_lio:
    <<: *common-runtime
    profiles: [raw, sim]
    image: g1-mapping-raw:local
    command: [ros2, launch, g1_mapping_bringup, raw_mapping.launch.py]
    stop_grace_period: 30s

  rviz:
    <<: *common-runtime
    profiles: [viz]
    image: g1-mapping-visualization:local
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: visualization
    environment:
      <<: *common-environment
      DISPLAY: ${DISPLAY:-}
      XAUTHORITY: /tmp/.Xauthority
      QT_X11_NO_MITSHM: "1"
      LIBGL_ALWAYS_SOFTWARE: ${LIBGL_ALWAYS_SOFTWARE:-1}
    volumes:
      - ${MAPPING_RUNS_DIR:-./runs}:/runs:ro
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${XAUTHORITY:-/dev/null}:/tmp/.Xauthority:ro
    command: [bash]

  pcd_server:
    <<: *common-runtime
    profiles: [viz]
    image: g1-mapping-visualization:local
    volumes:
      - ${MAPPING_RUNS_DIR:-./runs}:/runs:ro
    command: [bash]
