# FAST-LIO2（C5 に同梱の FAST_LIO）を **我々の記録** に合わせた設定。
#
# 出荷時の mid360.yaml は Livox の生ドライバ（/livox/custom_msg）前提だが、
# G1 は **`sensor_msgs/PointCloud2`** で出している。実測した中身:
#   x,y,z,intensity(f32),ring(u16),time(f32) / point_step 22 / 20,064 点
#   = velodyne_ros::Point と同じ並び -> lidar_type: 2（Velodyne）
#   time は **ナノ秒**（0〜100,320,000 = 0.1 s）-> timestamp_unit: 3
#   ⚠️ timestamp_unit を間違えると **deskew が静かに壊れる**（落ちない）
#   ring は **0〜3 の 4 値** -> scan_line: 4（出荷時と同じ）
/**:
  ros__parameters:
    feature_extract_enable: false   # ring が Velodyne 前提と違うので特徴抽出は使わない
    point_filter_num: 3
    max_iteration: 3
    filter_size_surf: 0.5
    filter_size_map: 0.5
    cube_side_length: 1000.0
    runtime_pos_log_enable: false
    map_file_path: "./test.pcd"

    common:
      lid_topic: "/utlidar/cloud_livox_mid360"
      imu_topic: "/utlidar/imu_livox_mid360"
      time_sync_en: false
      time_offset_lidar_to_imu: 0.0

    preprocess:
      lidar_type: 2          # 2 = Velodyne 互換の PointCloud2
      scan_line: 4
      blind: 0.5
      timestamp_unit: 3      # 3 = ナノ秒
      scan_rate: 10

    mapping:
      acc_cov: 0.1
      gyr_cov: 0.1
      b_acc_cov: 0.0001
      b_gyr_cov: 0.0001
      fov_degree: 360.0
      det_range: 100.0
      extrinsic_est_en: true
      extrinsic_T: [-0.011, -0.02329, 0.04412]
      extrinsic_R: [1., 0., 0., 0., 1., 0., 0., 0., 1.]

    publish:
      path_en: false
      effect_map_en: false
      map_en: false          # 地図の publish は要らない（CPU と帯域の節約）
      scan_publish_en: false
      dense_publish_en: false
      scan_bodyframe_pub_en: false

    pcd_save:
      pcd_save_en: false     # ⚠️ true にすると全フレームを 1 つの pcd に溜めてディスクを埋める
      interval: -1
