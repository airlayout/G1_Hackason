# 警備システム UI の設定。パスはこのファイルからの相対で書く。

video:
  # "video" | "zmq" | "webcam"
  #   video  … 手元の動画で UI を組むとき（いまはこれ）
  #   zmq    … 実機 G1 の `run_g1_server.py --camera` に繋ぐとき
  #   webcam … 手元のカメラで試すとき
  source: zmq

  video:
    path: ../Reference/夜間監視.mp4
    loop: true
    # ⚠️ 実時間で再生する（余ったフレームは捨てる）。false にすると 1 フレームずつ
    # 順に読むので、24fps の動画を target_fps=10 で読むと **2.4 倍遅くなり**、
    # 検知ログの継続時間も同じ倍率で水増しされる（2026-09-20 実測）
    realtime: true
  zmq:
    # ⚠️ ここは実機の「Full HD webcam」(/dev/video6)。G1 本体で
    #    Camera/camera_server.py を動かしておくこと（Camera/README.md）
    server_address: 192.168.123.164
    port: 5555
    camera_name: head_camera
    timeout_ms: 5000
  webcam:
    device_index: 0

  # 推論の上限 fps。上げても UI の見た目はほとんど変わらず GPU だけ食う
  target_fps: 10
  jpeg_quality: 80

detector:
  model: yolo26n.pt
  classes: [person]
  # 2026-09-20 にサンプル動画で実測: 0.5 と 0.25 で検出率が 53.8% / 56.0% とほぼ変わらず。
  # 下げる意味が無いので 0.5 のままにしてある
  confidence_threshold: 0.5
  device: auto        # "auto" | "cpu" | "cuda"

  # 検知ログの不感帯。素の判定だと検出が1フレーム落ちるたびに
  # 「消失 0.1秒」→「検知」が並んでログが読めなくなる（2026-09-20 実測）
  present_frames: 2     # これだけ連続で映ったら「検知」
  absent_grace_s: 1.5   # これだけ映らなかったら「消失」

nav:
  # "mock" | "http"
  #   mock … 実機も ROS も無しで UI を組む（いまはこれ）
  #   http … ROS アダプタに繋ぐ（有線: 操作PC の Docker / 無線: PC2。--wifi で後者）
  source: mock

  # 描く地図（http のときだけ効く。モックは mock.map_yaml を使う）
  #   nav2 … Nav2 が使っている /map をそのまま描く（推奨。現在地と必ず噛み合う）
  #   パス … その地図ファイル（.yaml）を描く。Nav2 の地図と大きさ・原点・中身を照合し、
  #          食い違えば画面に警告を出す（⚠️ 違う地図だと現在地がずれた場所に描かれる）
  #   例: ../../../Navigation/nav2_stable/maps/grids/room_a_map_20261021.yaml
  map: nav2

  mock:
    # ⚠️ Navigation トラックの既定地図。手で書き換えないこと
    map_yaml: ../../../Navigation/nav2_stable/maps/grids/room_a_map_20260911_edited.yaml
    speed_mps: 0.35
  http:
    url: http://127.0.0.1:8081
    timeout_s: 0.5
    # true なら操作ボタンを無効にし、操作をアダプタへ送らない（--wifi では必ず true）
    read_only: false

# 無線で使うとき（server.py --wifi / ../run.sh --wifi）。DDS は無線に通さない
wifi:
  # PC2 の Wi-Fi 側の IP。DHCP なので変わりうる（Navigation の WIRELESS.md）
  pc2_ip: 192.168.0.82
  # PC2 で動かす ROS アダプタの待ち受けポート
  adapter_port: 8081
  # アダプタへの問い合わせの待ち時間。無線は有線より遅れる
  timeout_s: 1.5

server:
  host: 127.0.0.1
  port: 8090        # 8080 は別プロセスが使っていたので避けている

log:
  # 検知イベントを JSONL で残す先
  dir: ../Log
