# Perception / real 設定
# 実行時に --config で別ファイルを指定することも可能です。

source:
  # "zmq" | "video" | "webcam"
  type: zmq

  zmq:
    # 実機G1で `python src/lerobot/robots/unitree_g1/run_g1_server.py --camera` を
    # 起動した後、そのG1に接続する。G1_HuggingFace/README.mdの実機接続手順を参照。
    server_address: 192.168.123.164
    port: 5555
    camera_name: head_camera
    timeout_ms: 5000

  video:
    # source.type: video のときに使うローカル動画ファイルパス(実機接続確認できない場合のフォールバック)
    path: sample.mp4
    loop: false

  webcam:
    # source.type: webcam のときに使うOpenCVのデバイス番号(手元での動作確認用)
    device_index: 0

detector:
  model: yolo26n.pt
  # 検出対象クラス(COCOのクラス名)。personのみに絞る
  classes: [person]
  confidence_threshold: 0.5
  # "auto" | "cpu" | "cuda"
  device: auto

output:
  console: true
  save_json: true
  save_csv: true
  output_dir: outputs

  # 以下は run_real_visual.py だけが読む(run_real.py は無視する)。
  # "none" | "all" | "detections_only"
  save_images: detections_only
  # 画像は再取得できるローカルデータなので _local/ 配下に置く(.gitignoreで除外済み)。
  # Perception/real/ から実行した場合の相対パス。
  image_dir: ../../_local/perception/real/images
