<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>スマホ GAME OVER</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 20px 16px 24px; display: flex; flex-direction: column; gap: 14px; background: #f2f2ef; color: #222; font-family: system-ui, -apple-system, 'Hiragino Sans', sans-serif; font-size: 15px; line-height: 1.5">

  <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 8px">
    <div style="font-weight: 700; font-size: 18px">STEALTH</div>
    <div style="font-size: 13px; color: #555">level3 ・ 運営と接続中</div>
  </div>

  <div style="background: #fff; border: 3px solid #b00020; padding: 20px 16px; display: flex; flex-direction: column; gap: 8px">
    <div style="font-size: 13px; color: #555">いまの状態</div>
    <div style="font-size: 34px; font-weight: 800; letter-spacing: 0.04em; color: #b00020">GAME OVER</div>
    <div style="font-size: 16px; font-weight: 700">理由: G1 に見つかった</div>
    <div style="font-size: 14px; color: #555">安全停止のときは「理由: G1 との距離が 1 m 以内」と出る。</div>
  </div>

  <div style="background: #fff; border: 1.5px solid #333; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px">
    <div style="font-weight: 700">その場で止まってください</div>
    <div>運営が再開するまで、動かずに待ってください。G1 が止まっているか、運営が確認します。</div>
  </div>

  <div style="flex: 1 1 0; min-height: 0"></div>

  <div style="border: 2px dashed #222; background: #fff; padding: 12px 16px; text-align: center; font-weight: 700">運営の再開を待っています…</div>
  <button disabled="disabled" style="min-height: 88px; border: 2px dashed #888; background: #e8e8e6; color: #666; font-size: 22px; font-weight: 800">TARGET を取った</button>
  <button disabled="disabled" style="min-height: 88px; border: 2px dashed #888; background: #e8e8e6; color: #666; font-size: 22px; font-weight: 800">START に戻った</button>
  <div style="font-size: 12px; color: #555; text-align: center">GAME OVER 中は、ボタンは押せない。再開できるのは運営だけ。</div>

  <div style="font-size: 13px; text-align: center; border-top: 1px solid #999; padding-top: 10px">歩く（走らない）／ G1 に近づかない</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
