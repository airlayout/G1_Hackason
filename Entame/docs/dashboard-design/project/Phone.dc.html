<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>プレイヤー用スマホ</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 20px 16px 24px; display: flex; flex-direction: column; gap: 14px; background: #f2f2ef; color: #222; font-family: system-ui, -apple-system, 'Hiragino Sans', sans-serif; font-size: 15px; line-height: 1.5">

  <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 8px">
    <div style="font-weight: 700; font-size: 18px">STEALTH</div>
    <div style="font-size: 13px; color: #555">level3 ・ 運営と接続中</div>
  </div>

  <div style="background: #fff; border: 2px solid #222; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px">
    <div style="font-size: 13px; color: #555">いまの状態</div>
    <div style="font-size: 28px; font-weight: 800; letter-spacing: 0.04em">PLAYING</div>
    <div style="font-size: 15px">経過 00:31</div>
  </div>

  <div style="background: #fff; border: 1.5px solid #333; padding: 12px 16px; display: flex; flex-direction: column; gap: 8px">
    <div style="font-weight: 700">すること</div>
    <sc-for list="{{steps}}" as="s" hint-placeholder-count="3">
      <div style="display: flex; align-items: center; gap: 10px">
        <div style="flex: none; width: 28px; height: 28px; box-sizing: border-box; border: 2px solid #222; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px">{{s.mark}}</div>
        <div style="flex: 1 1 0; min-width: 0">{{s.text}}</div>
        <div style="flex: none; font-size: 13px; font-weight: 700">{{s.state}}</div>
      </div>
    </sc-for>
  </div>

  <div style="border: 2px dashed #222; background: #fff; padding: 10px 16px; font-size: 14px">
    <div style="font-weight: 700">検知の表示（出たときだけ）</div>
    <div style="color: #555">見つかったら、すぐ GAME OVER の画面に変わる。</div>
  </div>

  <div style="flex: 1 1 0; min-height: 0"></div>

  <button style="min-height: 88px; border: 3px solid #222; background: #fff; font-size: 22px; font-weight: 800; cursor: pointer">TARGET を取った</button>
  <button disabled="disabled" style="min-height: 88px; border: 2px dashed #888; background: #e8e8e6; color: #666; font-size: 22px; font-weight: 800">START に戻った</button>
  <div style="font-size: 12px; color: #555; text-align: center">START に戻ったボタンは、TARGET を取ったあとに押せる。押す前に確かめる。</div>

  <div style="font-size: 13px; text-align: center; border-top: 1px solid #999; padding-top: 10px">歩く（走らない）／ G1 に近づかない</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      steps: [
        { mark: '1', text: 'START から出発する', state: '済み' },
        { mark: '2', text: 'TARGET に着いたらボタンを押す', state: 'いま' },
        { mark: '3', text: 'START に戻ったらボタンを押す', state: 'これから' }
      ]
    };
  }
}
</script>
</body>
</html>
