plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.robotvlm.pepperbridge'
    compileSdk 35

    defaultConfig {
        applicationId 'com.robotvlm.pepperbridge'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'com.aldebaran:qisdk:1.7.5'
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
}
