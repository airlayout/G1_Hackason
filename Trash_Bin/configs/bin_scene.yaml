# Trash_Bin / MuJoCo のシーン（ゴミ箱）。sim/bin_scene.py が読む。
# 対象は UiS のトイレのゴミ箱（ステンレス、36×25×59 cm、2026-11-04 に写真で確認）。
# 高さ（*_z）は床から [m]。前後・左右の位置は pelvis 座標 [m]（x 前方、y 左）。
# シミュレーションは pelvis を固定するので、床から pelvis までの高さ pelvis_height_m を使って pelvis 座標に直す。

# 床から pelvis までの高さ。Button_Press/J1-gen の設定と同じ値（立った姿勢の実機で約 0.73 m）
pelvis_height_m: 0.73

# 検出するときの姿勢（両腕を下ろしてカメラの視野から外す）。Button_Press/J1-gen/configs/sim_scene.yaml と同じ
detection_pose_deg:
  15: 11.5   # left_shoulder_pitch
  16: 20.0   # left_shoulder_roll
  18: 86.0   # left_elbow
  22: 11.5   # right_shoulder_pitch
  23: -20.0  # right_shoulder_roll
  25: 86.0   # right_elbow

# 開始時の右腕の姿勢 [deg]（shoulder_pitch, shoulder_roll, shoulder_yaw, elbow, wrist_roll, wrist_pitch, wrist_yaw）。
# 検出の姿勢（腕を下ろす）のままだと、右横に置いたゴミ箱に手が 5 cm めり込んで始まる（2026-11-05）。
# 全 0 は肘を約 90° 曲げて手を前に出した姿勢（手はゴミ箱の上端より上）
start_right_arm_deg: [0, 0, 0, 0, 0, 0, 0]

# 押す前に腰を前に傾ける角度 [deg]（waist_pitch、motor 14）。腕の指令を始めた直後にゆっくり傾け、押し終えて腕を戻したあと
# ゆっくり戻す（lib/lean.py）。0 なら傾けない（J1-gen と同じ）。
# 正面のゴミ箱は、腰を傾けないと腕が伸び切っても指先がフラップの面の約 1 cm 上までしか届かず、計画が通らない。
# 10° で約 3 cm、15° で約 4.5 cm 深く届き、J1-gen の安全な計画（すき間 1 cm・関節 0.5 rad/s）がそのまま通った。
# 頭カメラも同じだけ下を向く（設計値 47.6° + 15° ≈ 63°）ので、押している間に中が写る（2026-11-05、MuJoCo）。
# ⚠️ J1-gen は「腰は動かさない」方針（腕を動かすと前に傾いてバランスを崩した報告がある）。実機で使う前にチームで相談し、
#    5° → 10° → 15° と少しずつ確かめること
lean_waist_pitch_deg: 15
lean:
  max_speed_deg_s: 5.0   # 傾ける・戻す速さの上限
  settle_s: 1.0          # 傾け終わってから落ち着くのを待つ時間
  max_error_deg: 2.0     # 落ち着いたあと、実測が目標からこれ以上ずれていたら中止（腰が付いてこない）

# 計画とシミュレーションで使う手の衝突形状（sim/hand_shape.py）:
#   box   : J1-gen と同じ。手のメッシュ全体を包む箱 1 つ（約 13 × 6.6 × 10.6 cm）
#   parts : メッシュを格子に区切り、区画ごとに包む小さな箱の集まり。隅の張り出しが減る
# box では、ゴミ箱の開口に手を入れると実際には当たらないのに「すき間 1 cm を割る」として計画が通らなかった（2026-11-05）
hand_shape: parts

# 手首カメラ（シミュレーション用の仮の取り付け）。手に付ける用の USB Web カメラが 2 台ある（2026-10-15 の Slack）が、
# 取り付け位置は未定。値は Manipulation/wrist_press/config.yaml（dev/button_list-cam）と同じ: 右手首の手の甲側から、
# 指の向きを見る。光学座標（x 右、y 下、z 前）で、xyz は right_wrist_yaw_link 基準 [m]
wrist_camera:
  name: wrist_camera
  parent: right_wrist_yaw_link
  xyz: [0.035, -0.045, 0.055]
  rpy_deg: [-90, 0, -90]
  width: 320
  height: 240
  fovy_deg: 65

bin:
  # 置き場所: 体の正面（少し右）。正面（ロボット側の面）の x と、左右の中心の y。
  # 正面にするのは、押している間に頭カメラで中を見るため。体の右横（front_x −0.055、center_y −0.35）でも押せるが、
  # 頭カメラには写らない（2026-11-05、MuJoCo）。front_x はつま先（pelvis の約 0.14 m 前）より奥にする。
  # 中心が体の正面寄り（右に 15 cm 未満）だと、押す姿勢で右肩が胴体に当たる
  front_x: 0.15
  center_y: -0.18
  # 外形: 奥行（x）、幅（y）、高さ（床から上端まで）
  depth: 0.25
  width: 0.36
  height: 0.59
  # 上面は浅いすり鉢。外周（上端 height）から、中央の開口の縁（opening_z）まで下がる
  opening_depth: 0.14   # 開口の奥行（x）
  opening_width: 0.22   # 開口の幅（y）
  opening_z: 0.565      # 開口の縁の高さ（= 閉じたフラップの上面）
  wall_thickness: 0.004
  rgba: [0.75, 0.75, 0.78, 1.0]

flap:
  # 開口より少し小さい板。軸は前後方向（x）で、幅の中央を通る。片側を押し下げると反対側が上がる
  depth: 0.135
  width: 0.215
  thickness: 0.005
  mass_kg: 0.2
  # 閉じる向きへ戻す力。実物は重さの釣り合いで戻ると思われるが未測定なので、弱いばねで近似する
  stiffness_nm_per_rad: 0.05
  damping: 0.02
  range_deg: 85
  rgba: [0.85, 0.85, 0.88, 1.0]
  # 「NO」のステッカー（つや消し）。フラップの上面、軸から左寄り（写真の位置）
  sticker_center: [0.0, 0.03]   # フラップの中心から（x, y）
  sticker_size: [0.07, 0.10]    # 奥行（x）、幅（y）
  sticker_rgba: [0.95, 0.95, 0.95, 1.0]

# 中身（頭カメラに写るかを数える）。位置はゴミ箱の上面の中心から（x, y）、高さは床から
contents:
  - name: bag      # 黒い袋。底から 30 cm まで入っているとする
    center: [0.0, 0.0]
    size: [0.24, 0.35]
    z: [0.01, 0.30]
    rgba: [0.05, 0.05, 0.05, 1.0]
  - name: red      # 見つけたいもの（不審物の代わり）
    center: [0.0, 0.055]
    size: [0.08, 0.07]
    z: [0.30, 0.34]
    rgba: [0.9, 0.1, 0.1, 1.0]
  - name: cup
    center: [0.01, -0.065]
    size: [0.08, 0.07]
    z: [0.30, 0.36]
    rgba: [0.95, 0.95, 0.9, 1.0]

# 押す点（フラップの上面の点）
push:
  # フラップのどちらの半分を押すか（right / left）。書かなければ腕の側
  half: right
  # 開口の手前の縁から、押す点までの奥行 [m]。小さいと手がすり鉢の手前の斜面に近づき、大きいと届かない
  # （正面・腰 15° で、9 cm はフラップ約 47°、10 cm は約 31°。7〜8 cm は手前の斜面に近すぎて計画が通らない。2026-11-05）
  inset_m: 0.09
  # フラップの軸から、押す側へのずれ [m]。小さすぎると手の幅が軸をまたぎ、反対側の半分も押して回らない
  # （2.5 cm では約 19° で止まった。4〜6 cm で 48〜51°。2026-11-05、MuJoCo）
  from_axis_m: 0.05
  # 押す向き（pelvis 座標）。真下
  direction: [0.0, 0.0, -1.0]
  # 押し込む深さの上限 [m]。実際は、指先が進まなくなったところで止める（下の stop_lag_m）。
  # 腕が届く範囲（正面・腰 15° で、フラップの面から約 4.5 cm）より浅くする。深すぎると、腕が伸び切る手前で関節が急に回って
  # 計画が通らない
  depth_m: 0.02
  # 押し込みを止める遅れ [m]: 指令した指先が実際の指先より押す向きに先に出た量が、押し始めからこれだけ増えたら止めて保持する
  # （J1-gen の contact_stop と同じ考え方）。止めないとフラップが逃げたあとも押し付けて 80 N 以上になった。
  # J1-gen の 5 mm ではフラップが約 31° で止まり、10 mm で約 51°（力は 4 N 以下）（2026-11-05、MuJoCo）
  stop_lag_m: 0.010
  # 指の向きの候補 [手前（ロボット側）へ, 右へ]（deg。負なら前へ）。順に試し、計画が通った最初のものを使う
  # （view_bin.py は最初のものを使う）。正面では指を真下に向けると手首の可動域が足りず、前へ 30° 傾けると届く（2026-11-05）
  finger_tilts_deg: [[-30, 20], [-20, 20], [-40, 20], [-30, 10], [-30, 30]]
  # 押す点の何 m 上から真下へ下ろすか。J1-gen の既定は 5 cm（press.yaml の approach_distance_m）
  approach_m: 0.08
  # 押し込む速さ [m/s]。J1-gen の既定は 3 cm/s（press.yaml の press_speed_m_s）
  speed_m_s: 0.015
  # 手先が入ってよい箱（pelvis 座標 [m]）。J1-gen の press.yaml の workspace（ボタン押し用の仮の値、x の下限 0.10）を上書きする。
  # 体の右横に置いたときは押す点が x ≈ 0.08 になるので、x の下限を 0.0 にしてある（それ以外は J1-gen と同じ）
  workspace:
    min: [0.0, -0.55, -0.35]
    max: [0.65, 0.15, 0.45]
  # 経由する姿勢（Button_Press/J1-gen/configs/pipeline.yaml の via_pose と同じ書き方）。
  # J1-gen の既定は「机の縁の下をくぐらないように手を持ち上げる」姿勢で、低いゴミ箱では途中で手首が縁に近づくので使わない
  via_pose: zero
