# mainへのマージのレビューは各自で行う方針のため、他人の目がPRに入らない。
# このCIが唯一の機械的なチェックになる。
#
# 現状の対象はMappingのみ。Navigation・Perception・Entameにはテストが無いため、
# それらのPRでもCIは緑になるが中身は検証されていない。
# 「CIが緑だから安全」ではない点に注意する。各班のテストが用意できたらjobを追加する。

name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  mapping-tests:
    name: Mapping tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 実機・ROS 2・LiDARは不要。標準ライブラリのみのunittestに加えて、
      # シェルスクリプトの構文チェックとcompose.yamlの妥当性検証を行う。
      - name: Run Mapping tests
        run: bash Mapping/real/tests/run_tests.sh
